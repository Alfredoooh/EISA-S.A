<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tradutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    --bg: #FFFFFF;
    --card: #F2F2F2;
    --card2: #EAEAEA;
    --text: #000000;
    --dim: #666666;
    --line: #E9E9E9;

    --pri: #5C8FD6;
    --onpri: #FFFFFF;

    --popup-bg: #FFFFFF;
    --snackbar-bg: #1A1A1A;
    --snackbar-text: #FFFFFF;

    --ios: cubic-bezier(.32,.72,0,1);
    --std: cubic-bezier(.2,0,0,1);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1114;
      --card: #1D2024;
      --card2: #272A2E;
      --text: #E2E2E6;
      --dim: #C4C6CC;
      --line: #2A2D32;

      --pri: #7AA6E0;
      --onpri: #0F1114;

      --popup-bg: #272A2E;
      --snackbar-bg: #272A2E;
      --snackbar-text: #FFFFFF;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }

  /* ===== App shell (para permitir a tela de histórico deslizar por cima) ===== */
  #app {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform 0.45s var(--ios);
  }

  #app.push {
    transform: translate3d(-22%, 0, 0);
  }

  #dim {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    z-index: 55;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s var(--ios);
  }

  .appbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    flex-shrink: 0;
  }

  .appbar h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0;
  }

  .icon-btn-bar {
    margin-left: auto;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: none;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background-color 0.2s var(--std);
  }

  .icon-btn-bar:active {
    background: var(--card2);
  }

  .lang-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px 16px;
    flex-shrink: 0;
  }

  .lang-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 12px 14px 12px 18px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s var(--std);
  }

  .lang-btn:active {
    background: var(--card2);
  }

  .lang-btn .material-symbols-rounded {
    font-size: 20px;
    color: var(--dim);
  }

  .swap-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: none;
    background: color-mix(in srgb, var(--pri) 18%, var(--bg));
    color: var(--pri);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.25s var(--std), background-color 0.2s var(--std);
  }

  .swap-btn.spin {
    transform: rotate(180deg);
  }

  .swap-btn:active {
    background: color-mix(in srgb, var(--pri) 30%, var(--bg));
  }

  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .text-card {
    background: var(--card);
    border-radius: 28px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 160px;
    position: relative;
    flex-shrink: 0;
  }

  .text-card textarea {
    flex: 1;
    width: 100%;
    border: none;
    background: none;
    resize: none;
    font-family: inherit;
    font-size: 17px;
    color: var(--text);
    outline: none;
    line-height: 1.5;
  }

  .text-card textarea::placeholder {
    color: var(--dim);
  }

  .text-card .output-text {
    flex: 1;
    font-size: 17px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    overflow-y: auto;
  }

  .text-card .output-text.placeholder {
    color: var(--dim);
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .char-count {
    font-size: 12px;
    color: var(--dim);
  }

  .card-actions {
    display: flex;
    gap: 4px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: none;
    background: none;
    color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.2s var(--std);
  }

  .icon-btn:active {
    background: var(--card2);
  }

  .icon-btn .material-symbols-rounded {
    font-size: 19px;
  }

  .icon-btn.clear-btn {
    position: absolute;
    top: 14px;
    right: 14px;
  }

  .translate-btn {
    background: var(--pri);
    color: var(--onpri);
    border: none;
    border-radius: 999px;
    padding: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.2s ease;
    flex-shrink: 0;
  }

  .translate-btn:active {
    opacity: 0.85;
  }

  .translate-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .translate-btn .material-symbols-rounded {
    font-size: 20px;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid color-mix(in srgb, var(--onpri) 35%, transparent);
    border-top-color: var(--onpri);
    border-radius: 999px;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .translate-btn.loading .spinner {
    display: block;
  }

  .translate-btn.loading .btn-label,
  .translate-btn.loading .material-symbols-rounded {
    display: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .snackbar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--snackbar-bg);
    color: var(--snackbar-text);
    padding: 14px 20px;
    border-radius: 16px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s var(--std), transform 0.25s var(--std);
    z-index: 1000;
    max-width: 90%;
    text-align: center;
  }

  .snackbar.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Popup de seleção: fade + scale discreto (0.9→1), nunca de 0,
     e SEMPRE medido depois de um reflow forçado para não "saltar" ===== */
  #mscrim {
    position: fixed;
    inset: 0;
    z-index: 499;
  }

  .menu {
    position: fixed;
    z-index: 500;
    min-width: 230px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 8px;
    border-radius: 24px;
    background: var(--popup-bg);
    box-shadow: 0 8px 28px rgba(0,0,0,0.28);
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.15s var(--std), transform 0.15s var(--std);
  }

  .menu.in {
    opacity: 1;
    transform: scale(1);
  }

  .menu.out {
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.1s var(--std), transform 0.1s var(--std);
  }

  .menu button {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 13px 14px;
    border: none;
    background: none;
    border-radius: 16px;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
  }

  .menu button:active {
    background: var(--card2);
  }

  .menu button .material-symbols-rounded {
    color: var(--dim);
    font-size: 20px;
    flex-shrink: 0;
  }

  .menu button .ml {
    margin-left: auto;
    color: var(--pri);
  }

  /* ===== Tela de histórico (navegação real, estilo .page do app ao) ===== */
  .page {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    z-index: 60;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transform: translate3d(100%, 0, 0);
    visibility: hidden;
    box-shadow: -12px 0 32px rgba(0,0,0,0.22);
    transition: transform 0.45s var(--ios), visibility 0s 0.45s;
  }

  .page.on {
    transform: none;
    visibility: visible;
    transition: transform 0.45s var(--ios), visibility 0s;
  }

  .page.bk {
    transform: translate3d(-22%, 0, 0);
  }

  .pbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 16px 10px 6px;
  }

  .ptitle {
    flex: 1;
    min-width: 0;
    padding-left: 6px;
    font-size: 20px;
    font-weight: 500;
  }

  .pbody {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  #edge {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 18px;
    z-index: 70;
    display: none;
    touch-action: none;
  }

  #edge.on {
    display: block;
  }

  .history-title-row {
    padding: 0 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-clear-btn {
    font-size: 13px;
    font-weight: 600;
    color: var(--pri);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 999px;
  }

  .history-clear-btn:active {
    background: var(--card2);
  }

  .history-list {
    padding: 0 12px 20px;
  }

  .history-item {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    background: none;
    border: none;
    padding: 14px 12px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.2s var(--std);
  }

  .history-item:active {
    background: var(--card2);
  }

  .history-item .h-source {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
  }

  .history-item .h-translated {
    font-size: 14px;
    color: var(--dim);
  }

  .history-item .h-meta {
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
  }

  .history-empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--dim);
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="appbar">
    <h1>Tradutor</h1>
    <button class="icon-btn-bar" id="historyBtn">
      <span class="material-symbols-rounded">history</span>
    </button>
  </div>

  <div class="lang-bar">
    <button class="lang-btn" id="sourceLangBtn">
      <span id="sourceLangLabel">Deteção</span>
      <span class="material-symbols-rounded">expand_more</span>
    </button>
    <button class="swap-btn" id="swapBtn">
      <span class="material-symbols-rounded">swap_horiz</span>
    </button>
    <button class="lang-btn" id="targetLangBtn">
      <span id="targetLangLabel">Inglês</span>
      <span class="material-symbols-rounded">expand_more</span>
    </button>
  </div>

  <div class="content">
    <div class="text-card">
      <textarea id="sourceText" placeholder="Digite o texto..." maxlength="500"></textarea>
      <button class="icon-btn clear-btn" id="clearBtn">
        <span class="material-symbols-rounded">close</span>
      </button>
      <div class="card-footer">
        <span class="char-count"><span id="charCount">0</span>/500</span>
      </div>
    </div>

    <button class="translate-btn" id="translateBtn">
      <span class="material-symbols-rounded">translate</span>
      <span class="btn-label">Traduzir</span>
      <span class="spinner"></span>
    </button>

    <div class="text-card">
      <div class="output-text placeholder" id="outputText">A tradução aparece aqui</div>
      <div class="card-footer">
        <span class="char-count" id="detectedInfo"></span>
        <div class="card-actions">
          <button class="icon-btn" id="copyBtn">
            <span class="material-symbols-rounded">content_copy</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="dim"></div>

<!-- Tela de Histórico: navegação real, desliza da direita -->
<section class="page" id="pg-history">
  <div class="pbar">
    <button class="icon-btn-bar" data-back aria-label="Voltar">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="ptitle">Histórico</div>
  </div>
  <div class="history-title-row">
    <span></span>
    <button class="history-clear-btn" id="clearHistoryBtn">Limpar tudo</button>
  </div>
  <div class="pbody">
    <div class="history-list" id="historyList"></div>
  </div>
</section>

<div id="edge"></div>

<div class="snackbar" id="snackbar"></div>

<script>
  const languages = [
    ["auto", "Deteção"],
    ["pt", "Português"], ["en", "Inglês"], ["es", "Espanhol"], ["fr", "Francês"],
    ["de", "Alemão"], ["it", "Italiano"], ["nl", "Holandês"], ["ru", "Russo"],
    ["zh", "Chinês"], ["ja", "Japonês"], ["ko", "Coreano"], ["ar", "Árabe"],
    ["hi", "Hindi"], ["bn", "Bengali"], ["tr", "Turco"], ["pl", "Polaco"],
    ["uk", "Ucraniano"], ["sv", "Sueco"], ["no", "Norueguês"], ["da", "Dinamarquês"],
    ["fi", "Finlandês"], ["el", "Grego"], ["cs", "Checo"], ["ro", "Romeno"],
    ["hu", "Húngaro"], ["he", "Hebraico"], ["th", "Tailandês"], ["vi", "Vietnamita"],
    ["id", "Indonésio"], ["ms", "Malaio"], ["sw", "Suaíli"], ["sr", "Sérvio"],
    ["bg", "Búlgaro"], ["hr", "Croata"], ["sk", "Eslovaco"], ["sl", "Esloveno"],
    ["lt", "Lituano"], ["lv", "Letão"], ["et", "Estónio"], ["fa", "Persa"],
    ["ur", "Urdu"], ["ta", "Tâmil"], ["te", "Telugu"], ["ml", "Malaiala"],
    ["mr", "Marati"], ["gu", "Guzerate"], ["kn", "Canarês"], ["pa", "Panjabi"],
    ["af", "Africânder"], ["am", "Amárico"], ["az", "Azerbaijano"], ["be", "Bielorrusso"],
    ["bs", "Bósnio"], ["ca", "Catalão"], ["cy", "Galês"], ["eo", "Esperanto"],
    ["eu", "Basco"], ["ga", "Irlandês"], ["gl", "Galego"], ["is", "Islandês"],
    ["ka", "Georgiano"], ["kk", "Cazaque"], ["km", "Khmer"], ["ky", "Quirguiz"],
    ["lo", "Laosiano"], ["mk", "Macedónio"], ["mn", "Mongol"], ["mt", "Maltês"],
    ["my", "Birmanês"], ["ne", "Nepalês"], ["si", "Cingalês"], ["sq", "Albanês"],
    ["tg", "Tajique"], ["tl", "Filipino"], ["uz", "Usbeque"],
    ["xh", "Xhosa"], ["yo", "Iorubá"], ["zu", "Zulu"]
  ];

  const seen = new Set();
  const uniqueLangs = languages.filter(([code]) => {
    if (seen.has(code)) return false;
    seen.add(code);
    return true;
  });

  let sourceLang = 'auto';
  let targetLang = 'en';

  function langName(code) {
    return (uniqueLangs.find(([c]) => c === code) || [null, code])[1];
  }

  const sourceLangLabel = document.getElementById('sourceLangLabel');
  const targetLangLabel = document.getElementById('targetLangLabel');
  function refreshLangLabels() {
    sourceLangLabel.textContent = langName(sourceLang);
    targetLangLabel.textContent = langName(targetLang);
  }
  refreshLangLabels();

  function tick() { try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} }

  var cm = null;

  /* Popup: cria o elemento já com opacity:0, força reflow (offsetHeight)
     ANTES de medir dimensões, garantindo que a 1ª leitura de getBoundingClientRect
     já reflete o layout final — isso é o que elimina o "salto" inicial. */
  function menuNormal(anchor, itemsHtml, onClick) {
    closeMenu();
    var s = document.createElement('div'), m = document.createElement('div');
    s.id = 'mscrim';
    m.className = 'menu';
    m.innerHTML = itemsHtml;
    document.body.appendChild(s);
    document.body.appendChild(m);

    // força reflow síncrono antes de qualquer medição
    void m.offsetHeight;

    var rect = anchor.getBoundingClientRect(), vw = innerWidth, vh = innerHeight, gap = 12;
    var w = m.offsetWidth, h = m.offsetHeight;

    var left = (vw - rect.right) <= rect.left ? rect.right - w : rect.left;
    var top = rect.bottom + 6;
    if (top + h > vh - gap) top = Math.max(gap, rect.top - h - 6);
    left = Math.max(gap, Math.min(left, vw - w - gap));
    top = Math.max(gap, Math.min(top, vh - h - gap));

    m.style.left = left + 'px';
    m.style.top = top + 'px';
    m.style.transformOrigin = (rect.left + rect.width / 2 - left) + 'px ' + (rect.top + rect.height / 2 - top) + 'px';

    cm = { m: m, s: s };

    // segundo rAF garante que o browser já pintou o estado inicial
    // antes de iniciar a transição — evita o "pulo" visual
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { m.classList.add('in'); });
    });

    s.onclick = closeMenu;
    m.onclick = onClick;
    return m;
  }

  function closeMenu() {
    if (!cm) return;
    var c = cm;
    cm = null;
    c.m.classList.remove('in');
    c.m.classList.add('out');
    c.s.remove();
    setTimeout(function () { c.m.remove(); }, 100);
  }

  const sourceLangBtn = document.getElementById('sourceLangBtn');
  const targetLangBtn = document.getElementById('targetLangBtn');

  function langMenuHtml(list, selected) {
    return list.map(function ([code, name]) {
      var check = code === selected ? '<span class="material-symbols-rounded ml">check</span>' : '';
      return `<button type="button" data-code="${code}"><span>${name}</span>${check}</button>`;
    }).join('');
  }

  sourceLangBtn.addEventListener('click', function () {
    tick();
    menuNormal(sourceLangBtn, langMenuHtml(uniqueLangs, sourceLang), function (e) {
      var b = e.target.closest('button[data-code]');
      if (!b) return;
      tick();
      closeMenu();
      setTimeout(function () {
        sourceLang = b.dataset.code;
        refreshLangLabels();
      }, 100);
    });
  });

  targetLangBtn.addEventListener('click', function () {
    tick();
    var list = uniqueLangs.filter(([code]) => code !== 'auto');
    menuNormal(targetLangBtn, langMenuHtml(list, targetLang), function (e) {
      var b = e.target.closest('button[data-code]');
      if (!b) return;
      tick();
      closeMenu();
      setTimeout(function () {
        targetLang = b.dataset.code;
        refreshLangLabels();
      }, 100);
    });
  });

  /* ===== Navegação: pilha de telas estilo app ao (.page, .pbar, edge-swipe) ===== */
  var L = [], pend = null;
  function layer(close) {
    L.push(close);
    try { history.pushState({ l: L.length }, ''); } catch (e) {}
  }
  function back(then) {
    if (!L.length) { if (then) then(); return; }
    pend = then || null;
    var n = L.length;
    try { history.back(); } catch (e) {}
    setTimeout(function () {
      if (L.length === n) {
        var c = L.pop();
        if (c) c();
        if (pend) { var f = pend; pend = null; f(); }
      }
    }, 700);
  }
  window.addEventListener('popstate', function () {
    var c = L.pop();
    if (c) c();
    if (pend) { var f = pend; pend = null; setTimeout(f, 0); }
  });
  try { history.replaceState({ b: 1 }, ''); } catch (e) {}

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-back]')) back();
  });

  var stack = [], PAGES = ['pg-history'];
  function sync() {
    var n = stack.length;
    document.getElementById('app').classList.toggle('push', n > 0);
    document.getElementById('dim').style.opacity = n ? 0.3 : 0;
    document.getElementById('edge').classList.toggle('on', n > 0);
    PAGES.forEach(function (id) {
      var i = stack.indexOf(id), p = document.getElementById(id);
      if (!p) return;
      p.classList.toggle('on', i > -1);
      p.classList.toggle('bk', i > -1 && i < n - 1);
      p.style.zIndex = 60 + i;
    });
  }
  function openPage(id, init) {
    if (stack.indexOf(id) > -1) return;
    if (init) init();
    stack.push(id);
    sync();
    layer(function () {
      var i = stack.lastIndexOf(id);
      if (i > -1) stack.splice(i, 1);
      sync();
    });
  }

  // edge-swipe para voltar (arrasta da borda esquerda)
  (function () {
    var e = document.getElementById('edge'), app = document.getElementById('app'), x0 = 0, dx = 0, on = 0, p, u, W = 1;
    e.addEventListener('touchstart', function (t) {
      if (!stack.length) return;
      p = document.getElementById(stack[stack.length - 1]);
      u = stack.length > 1 ? document.getElementById(stack[stack.length - 2]) : app;
      x0 = t.touches[0].clientX; dx = 0; on = 1; W = innerWidth;
      p.style.transition = 'none'; u.style.transition = 'none';
    }, { passive: true });
    e.addEventListener('touchmove', function (t) {
      if (!on) return;
      dx = Math.max(0, Math.min(W, t.touches[0].clientX - x0));
      var k = dx / W;
      p.style.transform = 'translate3d(' + dx + 'px,0,0)';
      u.style.transform = 'translate3d(' + (-22 * (1 - k)) + '%,0,0)';
      if (u === app) document.getElementById('dim').style.opacity = 0.3 * (1 - k);
    }, { passive: true });
    function end() {
      if (!on) return;
      on = 0;
      p.style.transition = ''; u.style.transition = '';
      if (dx > W * 0.3) {
        p.style.transform = 'translate3d(100%,0,0)';
        u.style.transform = 'translate3d(0,0,0)';
        back();
        setTimeout(function () { p.style.transform = ''; u.style.transform = ''; }, 500);
      } else {
        p.style.transform = ''; u.style.transform = '';
        if (u === app) document.getElementById('dim').style.opacity = 0.3;
      }
    }
    e.addEventListener('touchend', end);
    e.addEventListener('touchcancel', end);
  })();

  // ===== Histórico de traduções =====
  const historyBtn = document.getElementById('historyBtn');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  function getHistory() {
    try { return JSON.parse(localStorage.getItem('translator_history') || '[]'); }
    catch (e) { return []; }
  }

  function addHistory(entry) {
    const h = getHistory();
    h.unshift(entry);
    try { localStorage.setItem('translator_history', JSON.stringify(h.slice(0, 50))); } catch (e) {}
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderHistory() {
    const h = getHistory();
    if (!h.length) {
      historyList.innerHTML = '<div class="history-empty">Sem traduções no histórico ainda.</div>';
      return;
    }
    historyList.innerHTML = h.map(function (item, i) {
      return `
        <button class="history-item" data-idx="${i}">
          <span class="h-source">${escapeHtml(item.source)}</span>
          <span class="h-translated">${escapeHtml(item.translated)}</span>
          <span class="h-meta">${langName(item.sourceLang)} → ${langName(item.targetLang)}</span>
        </button>
      `;
    }).join('');
  }

  historyBtn.addEventListener('click', function () {
    tick();
    openPage('pg-history', renderHistory);
  });

  historyList.addEventListener('click', function (e) {
    const item = e.target.closest('.history-item');
    if (!item) return;
    const h = getHistory();
    const entry = h[+item.dataset.idx];
    if (!entry) return;
    sourceText.value = entry.source;
    charCount.textContent = entry.source.length;
    sourceLang = entry.sourceLang;
    targetLang = entry.targetLang;
    refreshLangLabels();
    outputText.textContent = entry.translated;
    outputText.classList.remove('placeholder');
    back();
  });

  clearHistoryBtn.addEventListener('click', function () {
    try { localStorage.removeItem('translator_history'); } catch (e) {}
    renderHistory();
    showSnackbar('Histórico limpo');
  });

  // ===== Tradutor =====
  const sourceText = document.getElementById('sourceText');
  const outputText = document.getElementById('outputText');
  const translateBtn = document.getElementById('translateBtn');
  const swapBtn = document.getElementById('swapBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  const charCount = document.getElementById('charCount');
  const detectedInfo = document.getElementById('detectedInfo');
  const snackbar = document.getElementById('snackbar');

  sourceText.addEventListener('input', () => {
    charCount.textContent = sourceText.value.length;
  });

  clearBtn.addEventListener('click', () => {
    sourceText.value = '';
    charCount.textContent = '0';
    sourceText.focus();
  });

  swapBtn.addEventListener('click', () => {
    if (sourceLang === 'auto') return;
    swapBtn.classList.add('spin');
    setTimeout(() => swapBtn.classList.remove('spin'), 250);
    const temp = sourceLang;
    sourceLang = targetLang;
    targetLang = temp;
    refreshLangLabels();
  });

  function showSnackbar(msg) {
    snackbar.textContent = msg;
    snackbar.classList.add('show');
    setTimeout(() => snackbar.classList.remove('show'), 3000);
  }

  copyBtn.addEventListener('click', () => {
    const text = outputText.textContent;
    if (!text || outputText.classList.contains('placeholder')) return;
    navigator.clipboard.writeText(text);
    showSnackbar('Texto copiado');
  });

  async function translateText() {
    const text = sourceText.value.trim();
    if (!text) { showSnackbar('Digite um texto para traduzir'); return; }

    translateBtn.classList.add('loading');
    translateBtn.disabled = true;

    try {
      const langpair = sourceLang === 'auto' ? `autodetect|${targetLang}` : `${sourceLang}|${targetLang}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Falha na ligação ao serviço de tradução');
      const data = await res.json();
      if (data.responseStatus !== 200 && data.responseStatus !== "200") {
        throw new Error(data.responseDetails || 'Não foi possível traduzir');
      }
      const translated = data.responseData.translatedText;
      outputText.textContent = translated;
      outputText.classList.remove('placeholder');
      detectedInfo.textContent = data.responseData.match ? `Confiança: ${Math.round(data.responseData.match * 100)}%` : '';
      addHistory({ source: text, translated, sourceLang, targetLang });
    } catch (err) {
      showSnackbar('Erro ao traduzir. Tente novamente.');
      console.error(err);
    } finally {
      translateBtn.classList.remove('loading');
      translateBtn.disabled = false;
    }
  }

  translateBtn.addEventListener('click', translateText);
  sourceText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) translateText();
  });
</script>

</body>
