name: appao-android-debug

on:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: appao-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: "com.appao"

jobs:
  build:
    name: appao-android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'
          cache-provider: basic

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/appao"
          if [ ! -d "$PROJECT_DIR/app" ]; then PROJECT_DIR="$GITHUB_WORKSPACE"; fi
          if [ -d "$PROJECT_DIR/app/src/main" ]; then
            APP_MODULE_DIR="$PROJECT_DIR/app"
          elif [ -d "$PROJECT_DIR/src/main" ]; then
            APP_MODULE_DIR="$PROJECT_DIR"
          else
            echo "ERROR: No Android module was found below $PROJECT_DIR."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_MODULE_DIR=$APP_MODULE_DIR" >> "$GITHUB_ENV"

      - name: Download official Ionicons SVG assets
        env:
          IONICONS_VERSION: "v8.0.13"
        run: |
          set -euo pipefail

          if [ -z "${APP_MODULE_DIR:-}" ] || [ ! -d "$APP_MODULE_DIR/src/main" ]; then
            echo "ERROR: Could not find the Android module src/main directory."
            exit 1
          fi

          ICON_DIR="$APP_MODULE_DIR/src/main/assets/icons/ionicons"
          mkdir -p "$ICON_DIR"
          ICONS=(
            "menu-outline" "ellipsis-vertical-outline" "ellipsis-horizontal-outline" "arrow-back-outline" "arrow-forward-outline" "arrow-up-outline"
            "arrow-down-outline" "chevron-down-outline" "open-outline" "add-outline" "add-circle-outline" "search-outline"
            "home-outline" "home" "apps-outline" "apps" "compass-outline" "compass"
            "flame-outline" "sparkles-outline" "create-outline" "settings-outline" "contrast-outline" "language-outline"
            "globe-outline" "location-outline" "funnel-outline" "options-outline" "camera-outline" "folder-outline"
            "archive-outline" "bookmark-outline" "bookmark" "heart-outline" "heart" "pie-chart-outline"
            "bar-chart-outline" "checkmark-outline" "checkmark-circle-outline" "close-outline" "close-circle-outline" "link-outline"
            "share-social-outline" "refresh-outline" "trash-outline" "document-text-outline" "reader-outline" "newspaper-outline"
            "person-outline" "person-circle-outline" "speedometer-outline" "lock-closed-outline" "lock-open-outline" "image-outline"
            "attach-outline" "moon-outline" "sunny-outline" "shield-checkmark-outline" "download-outline" "file-tray-full-outline"
            "expand-outline" "contract-outline" "arrow-undo-outline" "arrow-redo-outline" "time-outline" "chatbubble-outline"
            "chatbubbles-outline" "rocket-outline" "notifications-outline" "eye-outline" "eye-off-outline" "wifi-outline"
            "calendar-outline" "copy-outline" "desktop-outline" "key-outline" "swap-vertical-outline" "mail-outline"
            "paper-plane-outline" "bluetooth-outline" "logo-google"
          )

          for icon in "${ICONS[@]}"; do
            target="$ICON_DIR/$icon.svg"
            if [ -s "$target" ] && grep -q '<svg' "$target"; then
              echo "Using cached Ionicon: $icon"
              continue
            fi
            tmp="$target.download"
            rm -f "$tmp"
            urls=(
              "https://cdn.jsdelivr.net/npm/ionicons@8.0.13/dist/ionicons/svg/$icon.svg"
              "https://raw.githubusercontent.com/ionic-team/ionicons/$IONICONS_VERSION/src/svg/$icon.svg"
            )
            downloaded=false
            for url in "${urls[@]}"; do
              if curl --fail --location --silent --show-error \
                  --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 60 \
                  --user-agent "AppAo-GitHub-Actions/1.0" "$url" --output "$tmp"; then
                if [ -s "$tmp" ] && grep -q '<svg' "$tmp" && [ "$(wc -c < "$tmp")" -gt 80 ]; then
                  downloaded=true
                  break
                fi
              fi
              rm -f "$tmp"
            done
            if [ "$downloaded" != "true" ]; then
              echo "ERROR: Could not download a valid Ionicons SVG for $icon from the pinned official release."
              exit 1
            fi
            mv "$tmp" "$target"
            chmod 644 "$target"
          done

          LICENSE_FILE="$APP_MODULE_DIR/IONICONS_LICENSE.txt"
          if [ ! -s "$LICENSE_FILE" ]; then
            cat > "$LICENSE_FILE" <<'LICENSE'
          Ionicons
          Copyright (c) 2015-present Ionic

          Ionicons is distributed under the MIT License. The official icon set and license are available at:
          https://github.com/ionic-team/ionicons

          The build downloads only the required SVG assets from the pinned upstream release v8.0.13.
          No Flaticon assets are scraped or bundled.
          LICENSE
          fi
          echo "Ionicons SVG assets downloaded and validated: ${#ICONS[@]} files."

      - name: Generate official Gradle Wrapper
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Gradle installed by setup-gradle:"
          gradle --version

          echo "Generating the official Gradle Wrapper for Gradle 8.2.1..."
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin --no-daemon

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle did not generate gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi

          if ! grep -Fq "gradle-8.2.1-bin.zip" "gradle/wrapper/gradle-wrapper.properties"; then
            echo "ERROR: Gradle Wrapper is not configured for Gradle 8.2.1."
            cat "gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          chmod +x ./gradlew
          echo "Gradle Wrapper generated and verified."
          ./gradlew --version

      - name: Create or load local signing keystore
        id: setup-signing
        env:
          LOOPLY_KEYSTORE_BASE64: ${{ secrets.LOOPLY_KEYSTORE_BASE64 }}
          LOOPLY_KEYSTORE_PASSWORD: ${{ secrets.LOOPLY_KEYSTORE_PASSWORD }}
          LOOPLY_KEY_ALIAS: ${{ secrets.LOOPLY_KEY_ALIAS }}
          LOOPLY_KEY_PASSWORD: ${{ secrets.LOOPLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNING_DIR="$RUNNER_TEMP/appao-local-signing-material"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          KEYSTORE_PATH="$SIGNING_DIR/appao-local.keystore"
          INFO_PATH="$SIGNING_DIR/SIGNING-INFO.txt"
          KEY_ALIAS="${LOOPLY_KEY_ALIAS:-appao-local}"
          GENERATED=false

          if [ -n "${LOOPLY_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${LOOPLY_KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: LOOPLY_KEYSTORE_BASE64 is set, but LOOPLY_KEYSTORE_PASSWORD is missing."
              exit 1
            fi

            echo "Loading the existing local keystore from GitHub Secrets..."
            printf '%s' "$LOOPLY_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$LOOPLY_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${LOOPLY_KEY_PASSWORD:-$STORE_PASSWORD}"

            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "ERROR: The decoded keystore is empty. Check LOOPLY_KEYSTORE_BASE64."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ERROR: Could not open the keystore or find alias '$KEY_ALIAS'. Check the keystore secrets."
              exit 1
            fi

            KEYSTORE_TYPE="$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>&1 | sed -n 's/^Keystore type: //p' | head -n 1)"
            KEYSTORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"
            echo "Existing keystore loaded. It will not be uploaded again as an artifact."
          else
            echo "No existing keystore secret found. Creating a local/testing-only keystore..."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEYSTORE_TYPE="PKCS12"

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype "$KEYSTORE_TYPE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=AppAo Local, OU=Development, O=AppAo, L=Luanda, ST=Luanda, C=AO"

            cat > "$INFO_PATH" <<EOF
          AppAo local/testing signing key — NOT intended as a Play Store release key
          Keystore file: appao-local.keystore
          Keystore type: $KEYSTORE_TYPE
          Key alias: $KEY_ALIAS
          Keystore password: $STORE_PASSWORD
          Key password: $KEY_PASSWORD

          Keep this keystore and its passwords private. Use the same keystore for future APK updates.
          To reuse it in later workflow runs, store the keystore as Base64 in the LOOPLY_KEYSTORE_BASE64 GitHub Secret,
          set LOOPLY_KEYSTORE_PASSWORD to the keystore password, LOOPLY_KEY_ALIAS to the alias,
          and LOOPLY_KEY_PASSWORD to the key password (the same as the keystore password for this generated key).
          EOF
            chmod 600 "$INFO_PATH"
            base64 -w 0 "$KEYSTORE_PATH" > "$SIGNING_DIR/appao-local.keystore.base64.txt"
            chmod 600 "$SIGNING_DIR/appao-local.keystore.base64.txt"
            GENERATED=true
            echo "A new local keystore was created."
          fi

          chmod 600 "$KEYSTORE_PATH"
          {
            echo "APP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APP_KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "APP_KEY_ALIAS=$KEY_ALIAS"
            echo "APP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "APP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "signing_dir=$SIGNING_DIR" >> "$GITHUB_OUTPUT"

      - name: Build app ao Debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib

          bad = []
          forbidden = ("getChildAte", "R.drawable/")
          for src in Path("app/src/main/java").rglob("*.kt"):
              text = src.read_text(encoding="utf-8")
              for needle in forbidden:
                  if needle in text:
                      bad.append(f"{src}: {needle}")
          if bad:
              raise SystemExit("Invalid Kotlin source remains:\n" + "\n".join(bad))

          main_candidates = list(Path("app/src/main/java").rglob("MainActivity.kt"))
          if not main_candidates:
              raise SystemExit("MainActivity.kt was not found under app/src/main/java")
          main = main_candidates[0]
          print("Build source sanity check: PASS")
          print("MainActivity SHA-256:", hashlib.sha256(main.read_bytes()).hexdigest())
          PYVERIFY

          python3 verify_project.py

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle Wrapper JAR is missing after the generation step."
            exit 1
          fi

          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Sign APK with local keystore
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK_DIR="$APP_MODULE_DIR/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*-debug.apk' ! -name 'appao-local-signed.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: The Debug APK was not found in $APK_DIR."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "ERROR: Android SDK Build Tools directory was not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in Android SDK Build Tools."
            exit 1
          fi

          SIGNED_APK="$APK_DIR/appao-local-signed.apk"
          "$APKSIGNER" sign \
            --ks "$APP_KEYSTORE_PATH" \
            --ks-type "$APP_KEYSTORE_TYPE" \
            --ks-key-alias "$APP_KEY_ALIAS" \
            --ks-pass env:APP_KEYSTORE_PASSWORD \
            --key-pass env:APP_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          echo "Signed local APK: $SIGNED_APK"

      - name: Verify APK size
        run: |
          set -euo pipefail
          APK="$APP_MODULE_DIR/build/outputs/apk/debug/appao-local-signed.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Signed local APK was not generated."
            exit 1
          fi

          bytes=$(stat -c%s "$APK")
          mib=$((bytes / 1024 / 1024))
          echo "APK: $APK"
          echo "Bytes: $bytes"
          echo "Size: ${mib} MiB"
          echo "Target: below 5 MiB (informational; Debug shrinking is disabled)"

          if [ "$bytes" -lt 5242880 ]; then
            echo "APK is below the 5 MiB target."
          else
            echo "WARNING: APK is above 5 MiB. This Debug build has code minification and resource shrinking disabled."
          fi

      - name: Upload locally signed APK
        uses: actions/upload-artifact@v4
        with:
          name: appao-local-signed-apk
          path: '**/build/outputs/apk/debug/appao-local-signed.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Warn if repository is public and key material is not being archived
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private != true
        run: |
          echo "::warning::This repository is public, so the generated keystore and its passwords will not be uploaded. Configure LOOPLY_KEYSTORE_BASE64, LOOPLY_KEYSTORE_PASSWORD, LOOPLY_KEY_ALIAS and LOOPLY_KEY_PASSWORD in GitHub Secrets to reuse one private key across builds."

      - name: Upload newly generated local keystore (private repositories only)
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: appao-local-signing-keystore
          path: ${{ steps.setup-signing.outputs.signing_dir }}/*
          if-no-files-found: error
          retention-days: 90
