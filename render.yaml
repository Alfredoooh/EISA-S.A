services:
  - type: web
    name: news-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CURRENTS_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CACHE_TTL
        value: 300
      - key: MIN_SOURCE_QUALITY
        value: 80
      - key: FRESHNESS_HOURS
        value: 48
