workflows:
  appao-android-debug:
    name: appao-android-debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appao_signing
      vars:
        PACKAGE_NAME: "com.appao"
      java: 17

    scripts:
      - name: Configure Android SDK
        script: |
          set -euo pipefail
          PROJECT_DIR="$CM_BUILD_DIR/appao"
          if [ ! -d "$PROJECT_DIR/app" ]; then PROJECT_DIR="$CM_BUILD_DIR"; fi
          if [ -d "$PROJECT_DIR/app/src/main" ]; then
            APP_MODULE_DIR="$PROJECT_DIR/app"
          elif [ -d "$PROJECT_DIR/src/main" ]; then
            APP_MODULE_DIR="$PROJECT_DIR"
          else
            echo "ERROR: No Android module was found below $PROJECT_DIR."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "APP_MODULE_DIR=$APP_MODULE_DIR" >> "$CM_ENV"

      - name: Download official Material Symbols Rounded icons
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/download_material_symbols_rounded.py
          python3 - <<'PYVERIFY'
          from pathlib import Path
          folder = Path("app/src/main/assets/icons/material-symbols-rounded")
          files = list(folder.glob("*.svg"))
          required = {
              "home_24px.svg", "home_fill1_24px.svg",
              "explore_24px.svg", "explore_fill1_24px.svg",
              "person_24px.svg", "person_fill1_24px.svg",
              "search_24px.svg", "menu_24px.svg",
          }
          missing = sorted(required - {file.name for file in files})
          if len(files) < 70 or missing:
              raise SystemExit(
                  f"ERROR: Incomplete Material Symbols Rounded set: {len(files)} SVGs; missing={missing}"
              )
          print(f"Material Symbols Rounded ready: {len(files)} SVG icons including outline and fill1 variants")
          PYVERIFY

      - name: Stop Gradle and clear generated-JAR cache
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --stop || true
          GRADLE_CACHE="${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "Clearing generated-JAR cache: $GRADLE_CACHE/caches/jars-9"
          rm -rf "$GRADLE_CACHE/caches/jars-9"

      - name: Generate official Gradle Wrapper
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Gradle installed:"
          gradle --version

          echo "Generating the official Gradle Wrapper for Gradle 8.13..."
          gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon --no-parallel

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle did not generate gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi

          if ! grep -Fq "gradle-8.13-bin.zip" "gradle/wrapper/gradle-wrapper.properties"; then
            echo "ERROR: Gradle Wrapper is not configured for Gradle 8.13."
            cat "gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          chmod +x ./gradlew
          echo "Gradle Wrapper generated and verified."
          ./gradlew --version

      - name: Create or load local signing keystore
        script: |
          set -euo pipefail

          SIGNING_DIR="$CM_BUILD_DIR/appao-local-signing-material"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          KEYSTORE_PATH="$SIGNING_DIR/appao-local.keystore"
          INFO_PATH="$SIGNING_DIR/SIGNING-INFO.txt"
          KEY_ALIAS="${LOOPLY_KEY_ALIAS:-appao-local}"
          GENERATED=false

          # Wrapper compatível com GNU base64 (Linux, suporta -w) e BSD base64 (macOS, sem -w)
          b64_oneline() {
            if base64 --help 2>&1 | grep -q -- '-w'; then
              base64 -w 0 "$1"
            else
              base64 "$1" | tr -d '\n'
            fi
          }

          if [ -n "${LOOPLY_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${LOOPLY_KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: LOOPLY_KEYSTORE_BASE64 is set, but LOOPLY_KEYSTORE_PASSWORD is missing."
              exit 1
            fi

            echo "Loading the existing local keystore from secrets..."
            printf '%s' "$LOOPLY_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$LOOPLY_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${LOOPLY_KEY_PASSWORD:-$STORE_PASSWORD}"

            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "ERROR: The decoded keystore is empty. Check LOOPLY_KEYSTORE_BASE64."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ERROR: Could not open the keystore or find alias '$KEY_ALIAS'. Check the keystore secrets."
              exit 1
            fi

            KEYSTORE_TYPE="$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>&1 | sed -n 's/^Keystore type: //p' | head -n 1)"
            KEYSTORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"
            echo "Existing keystore loaded. It will not be uploaded again as an artifact."
          else
            echo "No existing keystore secret found. Creating a local/testing-only keystore..."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEYSTORE_TYPE="PKCS12"

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype "$KEYSTORE_TYPE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=AppAo Local, OU=Development, O=AppAo, L=Luanda, ST=Luanda, C=AO"

            cat > "$INFO_PATH" <<EOF
          AppAo local/testing signing key — NOT intended as a Play Store release key
          Keystore file: appao-local.keystore
          Keystore type: $KEYSTORE_TYPE
          Key alias: $KEY_ALIAS
          Keystore password: $STORE_PASSWORD
          Key password: $KEY_PASSWORD

          Keep this keystore and its passwords private. Use the same keystore for future builds.
          To reuse it in later builds, store the keystore as Base64 in LOOPLY_KEYSTORE_BASE64,
          set LOOPLY_KEYSTORE_PASSWORD to the keystore password, LOOPLY_KEY_ALIAS to the alias,
          and LOOPLY_KEY_PASSWORD to the key password (the same as the keystore password for this generated key).
          EOF
            chmod 600 "$INFO_PATH"
            b64_oneline "$KEYSTORE_PATH" > "$SIGNING_DIR/appao-local.keystore.base64.txt"
            chmod 600 "$SIGNING_DIR/appao-local.keystore.base64.txt"
            GENERATED=true
            echo "A new local keystore was created."
          fi

          chmod 600 "$KEYSTORE_PATH"
          {
            echo "APP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APP_KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "APP_KEY_ALIAS=$KEY_ALIAS"
            echo "APP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "APP_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_GENERATED=$GENERATED"
            echo "SIGNING_DIR=$SIGNING_DIR"
          } >> "$CM_ENV"

      - name: Build appao Debug APK
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib

          bad = []
          forbidden = ("getChildAte", "R.drawable/")
          for src in Path("app/src/main/java").rglob("*.kt"):
              text = src.read_text(encoding="utf-8")
              for needle in forbidden:
                  if needle in text:
                      bad.append(f"{src}: {needle}")
          if bad:
              raise SystemExit("Invalid Kotlin source remains:\n" + "\n".join(bad))

          main_candidates = list(Path("app/src/main/java").rglob("MainActivity.kt"))
          if not main_candidates:
              raise SystemExit("MainActivity.kt was not found under app/src/main/java")
          main = main_candidates[0]
          print("Build source sanity check: PASS")
          print("MainActivity SHA-256:", hashlib.sha256(main.read_bytes()).hexdigest())
          PYVERIFY

          python3 verify_project.py

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle Wrapper JAR is missing after the generation step."
            exit 1
          fi

          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Sign APK with local keystore
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK_DIR="$APP_MODULE_DIR/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*-debug.apk' ! -name 'appao-local-signed.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: The Debug APK was not found in $APK_DIR."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "ERROR: Android SDK Build Tools directory was not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in Android SDK Build Tools."
            exit 1
          fi

          SIGNED_APK="$APK_DIR/appao-local-signed.apk"
          "$APKSIGNER" sign \
            --ks "$APP_KEYSTORE_PATH" \
            --ks-type "$APP_KEYSTORE_TYPE" \
            --ks-key-alias "$APP_KEY_ALIAS" \
            --ks-pass env:APP_KEYSTORE_PASSWORD \
            --key-pass env:APP_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          echo "Signed local APK: $SIGNED_APK"

      - name: Verify APK size
        script: |
          set -euo pipefail
          APK="$APP_MODULE_DIR/build/outputs/apk/debug/appao-local-signed.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Signed local APK was not generated."
            exit 1
          fi

          bytes=$(stat -f%z "$APK" 2>/dev/null || stat -c%s "$APK")
          mib=$((bytes / 1024 / 1024))
          echo "APK: $APK"
          echo "Bytes: $bytes"
          echo "Size: ${mib} MiB"
          echo "Target: below 5 MiB (informational; Debug shrinking is disabled)"

          if [ "$bytes" -lt 5242880 ]; then
            echo "APK is below the 5 MiB target."
          else
            echo "WARNING: APK is above 5 MiB. This Debug build has code minification and resource shrinking disabled."
          fi

      - name: Warn if key material is not being archived
        script: |
          set -euo pipefail
          if [ "${SIGNING_GENERATED:-false}" = "true" ]; then
            echo "::warning::A new local keystore was generated. Configure LOOPLY_KEYSTORE_BASE64, LOOPLY_KEYSTORE_PASSWORD, LOOPLY_KEY_ALIAS and LOOPLY_KEY_PASSWORD in your Codemagic environment group (appao_signing) to reuse one private key across builds."
          fi

    artifacts:
      - "**/build/outputs/apk/debug/appao-local-signed.apk"
      - "appao-local-signing-material/*"