plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


android {
    namespace 'com.appao'
    compileSdk 34

    defaultConfig {
        applicationId "com.appao"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            // Keep Debug faithful to the source code while runtime stability is being verified.
            minifyEnabled false
            shrinkResources false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/LICENSE*', '/META-INF/NOTICE*', '/META-INF/DEPENDENCIES', '/META-INF/*.version']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}


// Download only the official Remix Icon font at build time. The app uses glyphs from
// the font instead of packaged SVG/PNG interface icons, so vector quality is preserved.
def remixFontFile = file("src/main/assets/fonts/remixicon.ttf")
tasks.register("downloadRemixIconFont") {
    outputs.file(remixFontFile)
    doLast {
        if (!remixFontFile.exists() || remixFontFile.length() < 10000L) {
            remixFontFile.parentFile.mkdirs()
            def candidates = [
                "https://raw.githubusercontent.com/Remix-Design/RemixIcon/v4.9.1/fonts/remixicon.ttf",
                "https://cdn.jsdelivr.net/gh/Remix-Design/RemixIcon@v4.9.1/fonts/remixicon.ttf"
            ]
            Exception last = null
            boolean downloaded = false
            candidates.each { urlText ->
                if (!downloaded) {
                    try {
                        def connection = new URL(urlText).openConnection()
                        connection.setConnectTimeout(15000)
                        connection.setReadTimeout(30000)
                        connection.setRequestProperty("User-Agent", "AppAo-Gradle/1.0")
                        connection.getInputStream().withCloseable { input ->
                            remixFontFile.withOutputStream { output -> output << input }
                        }
                        if (remixFontFile.length() < 10000L) throw new GradleException("Downloaded Remix Icon font is unexpectedly small")
                        downloaded = true
                    } catch (Exception ex) {
                        last = ex
                        remixFontFile.delete()
                    }
                }
            }
            if (!downloaded) throw new GradleException("Unable to download official Remix Icon v4.9.1 font. Check GitHub Actions network access.", last)
        }
    }
}
tasks.named("preBuild").configure { dependsOn(tasks.named("downloadRemixIconFont")) }
