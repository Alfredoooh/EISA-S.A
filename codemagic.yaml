workflows:
  appao-android-debug:

    # Nome exibido para este workflow no Codemagic.
    name: appao-android-debug

    # Máquina Apple Silicon M2.
    instance_type: mac_mini_m2

    # Tempo máximo de execução de uma build, em minutos.
    max_build_duration: 60

    environment:

      # Variáveis públicas/não sensíveis do projeto.
      vars:
        PACKAGE_NAME: "com.appao"

      # Para utilizar variáveis secretas no futuro, crie um Environment
      # Variable Group no Codemagic e descomente:
      #
      # groups:
      #   - appao-production-signing

      # Java 17 é usado pelo Android Gradle Plugin 8.2.x.
      java: 17

    # ---------------------------------------------------------------
    # TRIGGERS
    # ---------------------------------------------------------------
    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

      # Cancela builds antigos da mesma branch quando chega um push novo.
      cancel_previous_builds: true

    # ---------------------------------------------------------------
    # CACHE
    # ---------------------------------------------------------------
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper/dists

    # ---------------------------------------------------------------
    # SCRIPTS
    # ---------------------------------------------------------------
    scripts:

      # -------------------------------------------------------------
      # ANDROID SDK
      # -------------------------------------------------------------
      # O codemagic.yaml está na raiz e o projeto Android está dentro
      # da pasta appao.
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/appao/local.properties"

      # -------------------------------------------------------------
      # KEYSTORE
      # -------------------------------------------------------------
      # O keystore também está dentro da pasta appao.
      #
      # Caminho esperado:
      #
      # appao/looply-debug.keystore
      #
      # Também existe suporte para:
      #
      # LOOPLY_KEYSTORE_BASE64
      #
      # através das variáveis secretas do Codemagic.
      - name: Set up signing keystore
        script: |
          if [ -f "$CM_BUILD_DIR/appao/looply-debug.keystore" ]; then
            echo "Using repository keystore: appao/looply-debug.keystore"

          elif [ -n "${LOOPLY_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding LOOPLY_KEYSTORE_BASE64..."

            if printf '%s' "$LOOPLY_KEYSTORE_BASE64" | \
              base64 --decode > "$CM_BUILD_DIR/appao/looply-debug.keystore" 2>/dev/null
            then
              :
            else
              printf '%s' "$LOOPLY_KEYSTORE_BASE64" | \
                base64 -D > "$CM_BUILD_DIR/appao/looply-debug.keystore"
            fi

            chmod 600 "$CM_BUILD_DIR/appao/looply-debug.keystore"

            echo "Keystore decoded successfully."

          else
            echo "ERROR: appao/looply-debug.keystore was not found."
            echo "ERROR: LOOPLY_KEYSTORE_BASE64 is also not configured."
            exit 1
          fi

      # -------------------------------------------------------------
      # BUILD
      # -------------------------------------------------------------
      # Entra na pasta appao porque todo o projeto Gradle está lá.
      - name: Build app ao Debug APK
        script: |
          cd "$CM_BUILD_DIR/appao"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      # -------------------------------------------------------------
      # APK SIZE CHECK
      # -------------------------------------------------------------
      # Limite absoluto:
      # 400 KiB = 409600 bytes.
      #
      # Os APKs agora ficam em:
      #
      # appao/app/build/outputs/apk/debug/
      - name: Verify APK size
        script: |
          set -e

          echo "Generated APK:"
          ls -lh "$CM_BUILD_DIR/appao/app/build/outputs/apk/debug/"*.apk

          found_apk=false

          for apk in "$CM_BUILD_DIR/appao/app/build/outputs/apk/debug/"*.apk; do

            if [ ! -f "$apk" ]; then
              continue
            fi

            found_apk=true

            bytes=$(stat -f%z "$apk")

            kib=$((bytes / 1024))

            echo "----------------------------------------"
            echo "APK: $apk"
            echo "Bytes: $bytes"
            echo "Size: ${kib} KiB"
            echo "Limit: 400 KiB"
            echo "----------------------------------------"

            if [ "$bytes" -gt 409600 ]; then
              echo "ERROR: APK exceeds 400 KiB."
              echo "Build rejected."
              exit 1
            fi

          done

          if [ "$found_apk" = false ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK size check passed."

    # ---------------------------------------------------------------
    # ARTIFACTS
    # ---------------------------------------------------------------
    # O APK aparece na área de Artifacts do Codemagic para download.
    artifacts:
      - appao/app/build/outputs/apk/debug/*.apk

    # ---------------------------------------------------------------
    # PUBLISHING
    # ---------------------------------------------------------------
    # Não existe "publishing:" aqui propositalmente.