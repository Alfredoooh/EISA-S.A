name: orbit-android-debug

on:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: orbit-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: "com.orbit.app"

jobs:
  build:
    name: orbit-android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic
          gradle-home-cache-cleanup: true

      - name: Locate Orbit project and configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          for candidate in \
            "$GITHUB_WORKSPACE/Orbit" \
            "$GITHUB_WORKSPACE/orbit" \
            "$GITHUB_WORKSPACE"; do

            if [ -f "$candidate/settings.gradle.kts" ] \
              && [ -f "$candidate/build.gradle.kts" ] \
              && [ -f "$candidate/app/build.gradle.kts" ] \
              && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Orbit Android project was not found."
            echo "Expected Orbit/ or orbit/ containing settings.gradle.kts, build.gradle.kts and app/."
            exit 1
          fi

          APP_MODULE_DIR="$PROJECT_DIR/app"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$PROJECT_DIR/local.properties"

          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_MODULE_DIR=$APP_MODULE_DIR"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          echo "Orbit project: $PROJECT_DIR"
          echo "Android module: $APP_MODULE_DIR"
          echo "Android SDK: $SDK_ROOT"

      - name: Install Android SDK API 36 and 37
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do

              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK API 36 and 37 are ready."

      - name: Regenerate Gradle Wrapper JAR to match declared version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER_PROPS" ]; then
            echo "ERROR: $WRAPPER_PROPS was not found."
            exit 1
          fi

          DECLARED_VERSION="$(
            grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' \
              "$WRAPPER_PROPS"
          )"

          if [ -z "$DECLARED_VERSION" ]; then
            echo "ERROR: Could not parse Gradle version from $WRAPPER_PROPS."
            exit 1
          fi

          echo "Wrapper properties declare Gradle $DECLARED_VERSION."
          echo "Regenerating official wrapper JAR for this version..."

          gradle wrapper \
            --gradle-version "$DECLARED_VERSION" \
            --distribution-type bin \
            --no-daemon

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle Wrapper JAR was not generated."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Regenerated Wrapper JAR SHA-256:"
          sha256sum "gradle/wrapper/gradle-wrapper.jar"

      - name: Verify Orbit project structure and resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if ! grep -Fq 'applicationId = "com.orbit.app"' \
            "app/build.gradle.kts"; then
            echo "ERROR: applicationId does not match com.orbit.app."
            exit 1
          fi

          if ! grep -Fq 'android:icon="@mipmap/ic_launcher"' \
            "app/src/main/AndroidManifest.xml"; then
            echo "ERROR: Launcher icon reference is missing."
            exit 1
          fi

          if ! grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' \
            "app/src/main/AndroidManifest.xml"; then
            echo "ERROR: Round launcher icon reference is missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path("app/src/main")
          errors = []

          for xml_file in root.rglob("*.xml"):
              try:
                  ET.parse(xml_file)
              except ET.ParseError as exc:
                  errors.append(f"{xml_file}: {exc}")

          required_icons = [
              "res/mipmap-mdpi/ic_launcher.png",
              "res/mipmap-hdpi/ic_launcher.png",
              "res/mipmap-xhdpi/ic_launcher.png",
              "res/mipmap-xxhdpi/ic_launcher.png",
              "res/mipmap-xxxhdpi/ic_launcher.png",
              "res/mipmap-anydpi-v26/ic_launcher.xml",
              "res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]

          for relative_path in required_icons:
              if not (root / relative_path).is_file():
                  errors.append(f"Missing launcher resource: {relative_path}")

          if errors:
              print("ERROR: Orbit project verification failed:")
              for error in errors:
                  print(f" - {error}")
              sys.exit(1)

          kotlin_files = list(root.rglob("*.kt"))
          xml_files = list(root.rglob("*.xml"))

          print("Orbit source verification: PASS")
          print(f"Kotlin files: {len(kotlin_files)}")
          print(f"XML files: {len(xml_files)}")
          print("Launcher mipmap resources: PASS")
          PY

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --version

      - name: Build Orbit Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Orbit Debug APK was not generated."
            find "$APP_MODULE_DIR/build/outputs" \
              -maxdepth 5 \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo "Orbit Debug APK generated successfully:"
          echo "$APK"

      - name: Create or load local signing keystore
        id: setup-signing
        env:
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 || secrets.LOOPLY_KEYSTORE_BASE64 }}
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD || secrets.LOOPLY_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS || secrets.LOOPLY_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD || secrets.LOOPLY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_DIR="$RUNNER_TEMP/orbit-local-signing-material"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          KEYSTORE_PATH="$SIGNING_DIR/orbit-local.keystore"
          INFO_PATH="$SIGNING_DIR/SIGNING-INFO.txt"

          KEY_ALIAS="${ORBIT_KEY_ALIAS:-orbit-local}"
          GENERATED=false

          if [ -n "${ORBIT_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${ORBIT_KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: The existing keystore password is missing."
              exit 1
            fi

            echo "Loading existing signing keystore..."

            printf '%s' "$ORBIT_KEYSTORE_BASE64" \
              | base64 --decode > "$KEYSTORE_PATH"

            STORE_PASSWORD="$ORBIT_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${ORBIT_KEY_PASSWORD:-$STORE_PASSWORD}"

            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "ERROR: The decoded keystore is empty."
              exit 1
            fi

            if ! keytool -list \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ERROR: The keystore or alias could not be verified."
              exit 1
            fi

            KEYSTORE_TYPE="$(
              keytool -list \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$STORE_PASSWORD" 2>&1 \
                | sed -n 's/^Keystore type: //p' \
                | head -n 1
            )"

            KEYSTORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"

            echo "Existing signing keystore loaded."

          else
            echo "No existing signing keystore found."
            echo "Creating a local testing keystore..."

            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEYSTORE_TYPE="PKCS12"

            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype "$KEYSTORE_TYPE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=Orbit Local, OU=Development, O=Orbit, L=Luanda, ST=Luanda, C=AO"

            cat > "$INFO_PATH" <<EOF
          Orbit local/testing signing key
          Keystore file: orbit-local.keystore
          Keystore type: $KEYSTORE_TYPE
          Key alias: $KEY_ALIAS
          Keystore password: $STORE_PASSWORD
          Key password: $KEY_PASSWORD

          Keep this keystore and its passwords private.
          Reuse this keystore for future builds that must preserve the same signing identity.

          GitHub Secrets:
          ORBIT_KEYSTORE_BASE64
          ORBIT_KEYSTORE_PASSWORD
          ORBIT_KEY_ALIAS
          ORBIT_KEY_PASSWORD
          EOF

            chmod 600 "$INFO_PATH"

            base64 -w 0 "$KEYSTORE_PATH" \
              > "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            chmod 600 "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            GENERATED=true
            echo "Local testing keystore created."
          fi

          chmod 600 "$KEYSTORE_PATH"

          {
            echo "APP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APP_KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "APP_KEY_ALIAS=$KEY_ALIAS"
            echo "APP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "APP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "signing_dir=$SIGNING_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign Orbit APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$APP_MODULE_DIR/build/outputs/apk/debug"
          APK="$APK_DIR/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Unsigned Debug APK was not found."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          SIGNED_APK="$APK_DIR/orbit-local-signed.apk"

          "$APKSIGNER" sign \
            --ks "$APP_KEYSTORE_PATH" \
            --ks-type "$APP_KEYSTORE_TYPE" \
            --ks-key-alias "$APP_KEY_ALIAS" \
            --ks-pass env:APP_KEYSTORE_PASSWORD \
            --key-pass env:APP_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo "Signed Orbit APK:"
          echo "$SIGNED_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/orbit-local-signed.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Signed Orbit APK was not generated."
            exit 1
          fi

          BYTES="$(stat -c%s "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"

          echo "APK: $APK"
          echo "Size: $BYTES bytes"
          echo "Size: $MIB MiB"

      - name: Upload Orbit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signed-apk
          path: '**/build/outputs/apk/debug/orbit-local-signed.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Warn if repository is public and the signing key is not archived
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private != true
        shell: bash
        run: |
          echo "::warning::A new local signing key was generated but will not be uploaded because this repository is public. Configure ORBIT_KEYSTORE_BASE64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS and ORBIT_KEY_PASSWORD in GitHub Secrets to reuse the same signing identity."

      - name: Upload generated signing keystore (private repositories only)
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signing-keystore
          path: ${{ steps.setup-signing.outputs.signing_dir }}/*
          if-no-files-found: error
          retention-days: 90