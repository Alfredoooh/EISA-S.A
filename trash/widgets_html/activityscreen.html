<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gráficos - Atividade de uso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    --bg: #ffffff;
    --surface: #f2f2f5;
    --surface-high: #e8e8ec;
    --text: #1a1a1a;
    --text-dim: #6b6b70;
    --chart-bar: #4ba3a3;
    --donut-c1: #4ba3a3;
    --donut-c2: #5c8fd6;
    --donut-c3: #d6a35c;
    --donut-c4: #9a7fd6;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --surface: #1c1c1f;
      --surface-high: #26262a;
      --text: #f0f0f0;
      --text-dim: #9a9a9f;
      --chart-bar: #2bb3ad;
      --donut-c1: #2bb3ad;
      --donut-c2: #7aa6e0;
      --donut-c3: #e0b36a;
      --donut-c4: #b093e8;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 20px 40px;
  }

  .content {
    max-width: 480px;
    margin: 0 auto;
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }

  /* ===== Chart card (barras) ===== */
  .chart-card {
    background: var(--surface);
    border-radius: 28px;
    padding: 24px 20px 16px;
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(16px);
    animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .chart-svg-wrap {
    width: 100%;
  }

  .bar-path {
    fill: var(--surface-high);
    transition: d 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-path.filled {
    fill: var(--chart-bar);
  }

  .grid-line {
    stroke: var(--surface-high);
    stroke-width: 1;
  }

  .chart-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding: 0 2px;
  }

  .chart-labels span {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }

  .chart-labels span.active {
    color: var(--chart-bar);
    font-weight: 600;
  }

  /* ===== Donut card ===== */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 16px;
  }

  .section-header h2 {
    font-size: 17px;
    font-weight: 500;
    margin: 0;
  }

  .donut-card {
    background: var(--surface);
    border-radius: 28px;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    opacity: 0;
    transform: translateY(16px);
    animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }

  .donut-wrap {
    position: relative;
    width: 180px;
    height: 180px;
  }

  .donut-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .donut-wrap circle {
    fill: none;
    stroke-width: 20;
  }

  .donut-track {
    stroke: var(--surface-high);
  }

  .donut-seg {
    stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .donut-value {
    font-size: 30px;
    font-weight: 600;
  }

  .donut-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .legend {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    opacity: 0;
    transform: translateX(-8px);
    animation: legendIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes legendIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .legend-name {
    flex: 1;
    color: var(--text);
  }

  .legend-value {
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="content">

  <div class="chart-card">
    <div class="chart-svg-wrap">
      <svg id="barsSvg" viewBox="0 0 320 160" width="100%" height="160" preserveAspectRatio="none">
        <line class="grid-line" x1="0" y1="53" x2="320" y2="53" />
        <line class="grid-line" x1="0" y1="106" x2="320" y2="106" />
        <line class="grid-line" x1="0" y1="159" x2="320" y2="159" />
      </svg>
    </div>
    <div class="chart-labels">
      <span>sáb</span>
      <span>dom</span>
      <span>seg</span>
      <span>ter</span>
      <span>qua</span>
      <span>qui</span>
      <span class="active">sex</span>
    </div>
  </div>

  <div class="section-header">
    <span class="material-symbols-rounded">donut_small</span>
    <h2>Fontes de notícias mais visitadas</h2>
  </div>

  <div class="donut-card">
    <div class="donut-wrap">
      <svg viewBox="0 0 180 180">
        <circle class="donut-track" cx="90" cy="90" r="72"></circle>
        <circle class="donut-seg" id="seg1" cx="90" cy="90" r="72" stroke="var(--donut-c1)"></circle>
        <circle class="donut-seg" id="seg2" cx="90" cy="90" r="72" stroke="var(--donut-c2)"></circle>
        <circle class="donut-seg" id="seg3" cx="90" cy="90" r="72" stroke="var(--donut-c3)"></circle>
        <circle class="donut-seg" id="seg4" cx="90" cy="90" r="72" stroke="var(--donut-c4)"></circle>
      </svg>
      <div class="donut-center">
        <span class="donut-value">47</span>
        <span class="donut-sub">visitas</span>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item" style="animation-delay:0.5s">
        <span class="legend-dot" style="background:var(--donut-c1)"></span>
        <span class="legend-name">G1</span>
        <span class="legend-value">18</span>
      </div>
      <div class="legend-item" style="animation-delay:0.58s">
        <span class="legend-dot" style="background:var(--donut-c2)"></span>
        <span class="legend-name">RTP</span>
        <span class="legend-value">14</span>
      </div>
      <div class="legend-item" style="animation-delay:0.66s">
        <span class="legend-dot" style="background:var(--donut-c3)"></span>
        <span class="legend-name">BBC</span>
        <span class="legend-value">9</span>
      </div>
      <div class="legend-item" style="animation-delay:0.74s">
        <span class="legend-dot" style="background:var(--donut-c4)"></span>
        <span class="legend-name">DW</span>
        <span class="legend-value">6</span>
      </div>
    </div>
  </div>

</div>

<script>
  /* ===== Gráfico de barras: topo com cantos levemente arredondados, base reta (apoiada no eixo) ===== */
  const svg = document.getElementById('barsSvg');
  const values = [4, 2, 18, 35, 10, 22, 100]; // % de altura (0-100), última é "sex"
  const activeIndex = 6;

  const VB_W = 320, VB_H = 160;
  const colCount = values.length;
  const gap = 10;
  const barW = (VB_W - gap * (colCount - 1)) / colCount;
  const radius = 6; // raio fixo e discreto, só nos dois cantos superiores

  function buildPath(x, w, h) {
    const r = Math.min(radius, h); // nunca maior que a própria altura da barra
    const top = VB_H - h;
    const bottom = VB_H;
    // base reta (sem curva) apoiada no eixo, topo com cantos arredondados
    return `
      M ${x} ${bottom}
      L ${x} ${top + r}
      Q ${x} ${top} ${x + r} ${top}
      L ${x + w - r} ${top}
      Q ${x + w} ${top} ${x + w} ${top + r}
      L ${x + w} ${bottom}
      Z
    `;
  }

  values.forEach((v, i) => {
    const x = i * (barW + gap);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('bar-path');
    if (i === activeIndex) path.classList.add('filled');

    path.setAttribute('d', buildPath(x, barW, 2));
    svg.appendChild(path);

    requestAnimationFrame(() => {
      setTimeout(() => {
        const finalH = Math.max((v / 100) * (VB_H - 4), 4);
        path.setAttribute('d', buildPath(x, barW, finalH));
      }, 120 + i * 60);
    });
  });

  /* ===== Donut animado ===== */
  const CIRC = 2 * Math.PI * 72;
  const data = [
    { id: 'seg1', value: 18 },
    { id: 'seg2', value: 14 },
    { id: 'seg3', value: 9 },
    { id: 'seg4', value: 6 }
  ];
  const total = data.reduce((a, d) => a + d.value, 0);
  const gapLen = 5;

  let acc = 0;
  data.forEach((d, i) => {
    const el = document.getElementById(d.id);
    const length = (d.value / total) * CIRC;
    const segLength = Math.max(length - gapLen, 2);

    el.style.strokeDasharray = `0 ${CIRC}`;
    el.style.strokeDashoffset = -acc;

    setTimeout(() => {
      el.style.transitionProperty = 'stroke-dasharray';
      el.style.transitionDuration = '0.9s';
      el.style.transitionTimingFunction = 'cubic-bezier(0.22, 1, 0.36, 1)';
      el.style.transitionDelay = (i * 0.12) + 's';
      el.style.strokeDasharray = `${segLength} ${CIRC - segLength}`;
    }, 200);

    acc += length;
  });
</script>

</body>
</html>
