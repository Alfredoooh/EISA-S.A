<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AppAo — Splash Vector Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#111;color:#fff}body{display:grid;place-items:center;padding:24px}.wrap{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{aspect-ratio:1;border-radius:28px;display:grid;place-items:center;overflow:hidden}.light{background:#fff}.dark{background:#0d0f12}.logo{width:62%;animation:splashIn .9s cubic-bezier(.22,1.35,.36,1) both}.light .logo{content:url('appao_logo_vector_light.svg')}.dark .logo{content:url('appao_logo_vector.svg')}@keyframes splashIn{0%{transform:scale(.78)}100%{transform:scale(1)}}@media(max-width:620px){.wrap{grid-template-columns:1fr}.logo{width:58%}}
</style>
</head>
<body>
<div class="wrap">
<div class="box light"><img class="logo" src="appao_logo_vector_light.svg" alt="AppAo claro"></div>
<div class="box dark"><img class="logo" src="appao_logo_vector.svg" alt="AppAo escuro"></div>
</div>
</body>
</html>
