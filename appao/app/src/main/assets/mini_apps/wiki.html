<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Encyclopedia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    --bg: #FFFFFF;
    --card: #F2F2F2;
    --card2: #EAEAEA;
    --card3: #E2E2E2;
    --text: #000000;
    --dim: #666666;
    --line: #E9E9E9;

    --pri: #5C8FD6;
    --onpri: #FFFFFF;
    --pri-container: #DCE8FA;
    --on-pri-container: #0E2A4D;

    --std: cubic-bezier(.2,0,0,1);
    --ios: cubic-bezier(.32,.72,0,1);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1114;
      --card: #1D2024;
      --card2: #272A2E;
      --card3: #313539;
      --text: #E2E2E6;
      --dim: #C4C6CC;
      --line: #2A2D32;

      --pri: #7AA6E0;
      --onpri: #0F1114;
      --pri-container: #22395C;
      --on-pri-container: #DCE8FA;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }

  #app {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform 0.45s var(--ios);
  }

  #app.push {
    transform: translate3d(-22%, 0, 0);
  }

  #dim {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    z-index: 55;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s var(--ios);
  }

  /* ===== Search bar: fica fixa, compacta no topo (padrão mobile real) ===== */
  .search-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 8px;
  }

  .search-field {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border-radius: 999px;
    padding: 11px 14px;
    transition: background-color 0.2s var(--std);
  }

  .search-field:focus-within {
    background: var(--card2);
  }

  .search-field .material-symbols-rounded {
    color: var(--dim);
    font-size: 20px;
    flex-shrink: 0;
  }

  .search-field input {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
  }

  .search-field input::placeholder {
    color: var(--dim);
  }

  .clear-search-btn {
    display: none;
    border: none;
    background: none;
    color: var(--dim);
    cursor: pointer;
    padding: 2px;
    flex-shrink: 0;
  }

  .clear-search-btn.show {
    display: flex;
  }

  .random-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: none;
    background: var(--pri);
    color: var(--onpri);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.2s var(--std);
  }

  .random-btn:active {
    transform: scale(0.9);
  }

  /* ===== Tabs M3 Expressive (pill indicator que desliza) — só aparecem em pesquisa ===== */
  .search-tabs {
    flex-shrink: 0;
    display: none;
    padding: 4px 16px 12px;
  }

  .search-tabs.show {
    display: block;
  }

  .tabbar {
    position: relative;
    display: flex;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
  }

  .tab-indicator {
    position: absolute;
    top: 4px;
    left: 4px;
    height: calc(100% - 8px);
    width: calc(50% - 4px);
    background: var(--pri);
    border-radius: 999px;
    transition: transform 0.35s var(--std);
  }

  .tabbar.on-images .tab-indicator {
    transform: translateX(100%);
  }

  .tab-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    background: none;
    padding: 10px 0;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.25s var(--std);
  }

  .tab-btn.active {
    color: var(--onpri);
  }

  .tab-btn .material-symbols-rounded {
    font-size: 18px;
  }

  /* ===== Content area ===== */
  .scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .section-label {
    padding: 4px 16px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ===== Featured card ===== */
  .featured-card {
    margin: 0 14px 20px;
    background: var(--card);
    border-radius: 28px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s var(--std);
  }

  .featured-card:active {
    transform: scale(0.98);
  }

  .featured-img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    background: var(--card2);
    display: block;
  }

  .featured-body {
    padding: 16px 18px 18px;
  }

  .featured-body h2 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.25;
  }

  .featured-body p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Text results list ===== */
  .article-list {
    padding: 0 10px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .article-item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 10px;
    border-radius: 18px;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.15s var(--std);
  }

  .article-item:active {
    background: var(--card);
  }

  .article-thumb {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--card);
  }

  .article-thumb-placeholder {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    flex-shrink: 0;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
  }

  .article-info {
    flex: 1;
    min-width: 0;
  }

  .article-info h3 {
    margin: 0 0 3px;
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .article-info p {
    margin: 0;
    font-size: 12.5px;
    color: var(--dim);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
  }

  /* ===== Image grid results ===== */
  .image-grid {
    padding: 0 10px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .image-tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    background: var(--card);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s var(--std);
  }

  .image-tile:active {
    transform: scale(0.96);
  }

  .image-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .image-tile .image-tile-no-img {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    background: var(--card2);
  }

  .image-tile-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== Topic chips (home) ===== */
  .topic-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 0 14px 20px;
  }

  .topic-chip {
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--card);
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s var(--std);
  }

  .topic-chip:active {
    background: var(--card2);
  }

  /* ===== Loading / empty states ===== */
  .loading-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
  }

  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid var(--card2);
    border-top-color: var(--pri);
    border-radius: 999px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .empty-state {
    padding: 50px 24px;
    text-align: center;
    color: var(--dim);
    font-size: 13.5px;
  }

  .empty-state .material-symbols-rounded {
    font-size: 34px;
    display: block;
    margin: 0 auto 10px;
    opacity: 0.5;
  }

  .skeleton-item {
    display: flex;
    gap: 12px;
    padding: 10px;
  }

  .skeleton-thumb, .skeleton-line, .skeleton-tile {
    background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 10px;
  }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  .skeleton-thumb {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    flex-shrink: 0;
  }

  .skeleton-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
    justify-content: center;
  }

  .skeleton-line {
    height: 11px;
  }

  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w90 { width: 90%; }

  .skeleton-grid {
    padding: 0 10px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .skeleton-tile {
    aspect-ratio: 1;
    border-radius: 20px;
  }

  /* ===== Article page ===== */
  .page {
    position: absolute;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    z-index: 60;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transform: translate3d(100%, 0, 0);
    visibility: hidden;
    box-shadow: -12px 0 32px rgba(0,0,0,0.22);
    transition: transform 0.45s var(--ios), visibility 0s 0.45s;
  }

  .page.on {
    transform: none;
    visibility: visible;
    transition: transform 0.45s var(--ios), visibility 0s;
  }

  .page.bk {
    transform: translate3d(-22%, 0, 0);
  }

  .pbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 8px 6px;
  }

  .icon-btn-bar {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: none;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    transition: background-color 0.2s var(--std);
  }

  .icon-btn-bar:active {
    background: var(--card);
  }

  .ptitle {
    flex: 1;
    min-width: 0;
    padding-left: 4px;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pbody {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 40px;
    -webkit-overflow-scrolling: touch;
  }

  .article-hero {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    display: block;
    background: var(--card);
  }

  .article-header {
    padding: 18px 18px 4px;
  }

  .article-header h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
  }

  .article-header .article-desc {
    margin: 0;
    font-size: 13.5px;
    color: var(--dim);
    font-style: italic;
  }

  .article-body {
    padding: 14px 18px 0;
    font-size: 15.5px;
    line-height: 1.65;
  }

  .article-body p {
    margin: 0 0 15px;
  }

  .article-footer {
    padding: 8px 18px 18px;
  }

  .wiki-link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    border-radius: 999px;
    background: var(--card);
    border: none;
    color: var(--pri);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .wiki-link-btn:active {
    background: var(--card2);
  }

  /* ===== Visualizador de imagem (tela da aba "Imagens") ===== */
  .img-viewer-hero {
    width: 100%;
    max-height: 50vh;
    object-fit: contain;
    background: #000;
    display: block;
  }

  .img-viewer-caption {
    padding: 16px 18px;
    font-size: 14px;
    color: var(--dim);
    line-height: 1.5;
  }

  #edge {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 18px;
    z-index: 70;
    display: none;
    touch-action: none;
  }

  #edge.on {
    display: block;
  }
</style>
</head>
<body>

<div id="app">
  <div class="search-bar">
    <div class="search-field">
      <span class="material-symbols-rounded">search</span>
      <input type="text" id="searchInput" placeholder="Search the encyclopedia..." autocomplete="off">
      <button class="clear-search-btn" id="clearSearchBtn">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <button class="random-btn" id="randomBtn" title="Random article">
      <span class="material-symbols-rounded">shuffle</span>
    </button>
  </div>

  <div class="search-tabs" id="searchTabs">
    <div class="tabbar" id="tabbar">
      <div class="tab-indicator"></div>
      <button class="tab-btn active" data-tab="text">
        <span class="material-symbols-rounded">article</span>
        Texts
      </button>
      <button class="tab-btn" data-tab="images">
        <span class="material-symbols-rounded">image</span>
        Images
      </button>
    </div>
  </div>

  <div class="scroll-area" id="scrollArea">
    <div id="homeContent">
      <div class="section-label">Featured today</div>
      <div id="featuredWrap"></div>

      <div class="section-label">Explore topics</div>
      <div class="topic-chips" id="topicChips"></div>
    </div>

    <div id="textResults" style="display:none">
      <div class="article-list" id="resultsList"></div>
    </div>

    <div id="imageResults" style="display:none">
      <div class="image-grid" id="imageGrid"></div>
    </div>
  </div>
</div>

<div id="dim"></div>

<section class="page" id="pg-article">
  <div class="pbar">
    <button class="icon-btn-bar" data-back aria-label="Back">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="ptitle" id="articleTitleBar"></div>
  </div>
  <div class="pbody" id="articlePbody"></div>
</section>

<section class="page" id="pg-image">
  <div class="pbar">
    <button class="icon-btn-bar" data-back aria-label="Back">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="ptitle" id="imageTitleBar"></div>
  </div>
  <div class="pbody" id="imagePbody"></div>
</section>

<div id="edge"></div>

<script>
  const WIKI_BASE = 'https://en.wikipedia.org';
  const COMMONS_API = 'https://commons.wikimedia.org/w/api.php';

  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  const randomBtn = document.getElementById('randomBtn');
  const homeContent = document.getElementById('homeContent');
  const textResults = document.getElementById('textResults');
  const imageResults = document.getElementById('imageResults');
  const resultsList = document.getElementById('resultsList');
  const imageGrid = document.getElementById('imageGrid');
  const featuredWrap = document.getElementById('featuredWrap');
  const topicChips = document.getElementById('topicChips');
  const searchTabsWrap = document.getElementById('searchTabs');
  const tabbar = document.getElementById('tabbar');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== Navegação de página =====
  var L = [], pend = null;
  function layer(close) {
    L.push(close);
    try { history.pushState({ l: L.length }, ''); } catch (e) {}
  }
  function back(then) {
    if (!L.length) { if (then) then(); return; }
    pend = then || null;
    var n = L.length;
    try { history.back(); } catch (e) {}
    setTimeout(function () {
      if (L.length === n) {
        var c = L.pop();
        if (c) c();
        if (pend) { var f = pend; pend = null; f(); }
      }
    }, 700);
  }
  window.addEventListener('popstate', function () {
    var c = L.pop();
    if (c) c();
    if (pend) { var f = pend; pend = null; setTimeout(f, 0); }
  });
  try { history.replaceState({ b: 1 }, ''); } catch (e) {}

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-back]')) back();
  });

  var stack = [], PAGES = ['pg-article', 'pg-image'];
  function sync() {
    var n = stack.length;
    document.getElementById('app').classList.toggle('push', n > 0);
    document.getElementById('dim').style.opacity = n ? 0.3 : 0;
    document.getElementById('edge').classList.toggle('on', n > 0);
    PAGES.forEach(function (id) {
      var i = stack.indexOf(id), p = document.getElementById(id);
      if (!p) return;
      p.classList.toggle('on', i > -1);
      p.classList.toggle('bk', i > -1 && i < n - 1);
      p.style.zIndex = 60 + i;
    });
  }
  function openPage(id, init) {
    if (init) init();
    stack.push(id);
    sync();
    layer(function () {
      var i = stack.lastIndexOf(id);
      if (i > -1) stack.splice(i, 1);
      sync();
    });
  }

  (function () {
    var e = document.getElementById('edge'), app = document.getElementById('app'), x0 = 0, dx = 0, on = 0, p, u, W = 1;
    e.addEventListener('touchstart', function (t) {
      if (!stack.length) return;
      p = document.getElementById(stack[stack.length - 1]);
      u = stack.length > 1 ? document.getElementById(stack[stack.length - 2]) : app;
      x0 = t.touches[0].clientX; dx = 0; on = 1; W = innerWidth;
      p.style.transition = 'none'; u.style.transition = 'none';
    }, { passive: true });
    e.addEventListener('touchmove', function (t) {
      if (!on) return;
      dx = Math.max(0, Math.min(W, t.touches[0].clientX - x0));
      var k = dx / W;
      p.style.transform = 'translate3d(' + dx + 'px,0,0)';
      u.style.transform = 'translate3d(' + (-22 * (1 - k)) + '%,0,0)';
      if (u === app) document.getElementById('dim').style.opacity = 0.3 * (1 - k);
    }, { passive: true });
    function end() {
      if (!on) return;
      on = 0;
      p.style.transition = ''; u.style.transition = '';
      if (dx > W * 0.3) {
        p.style.transform = 'translate3d(100%,0,0)';
        u.style.transform = 'translate3d(0,0,0)';
        back();
        setTimeout(function () { p.style.transform = ''; u.style.transform = ''; }, 500);
      } else {
        p.style.transform = ''; u.style.transform = '';
        if (u === app) document.getElementById('dim').style.opacity = 0.3;
      }
    }
    e.addEventListener('touchend', end);
    e.addEventListener('touchcancel', end);
  })();

  // ===== Wikipedia / Commons API =====
  async function fetchSummary(title) {
    const url = `${WIKI_BASE}/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Not found');
    return res.json();
  }

  async function fetchRandomSummary() {
    const url = `${WIKI_BASE}/api/rest_v1/page/random/summary`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed');
    return res.json();
  }

  async function searchArticles(query) {
    const url = `${WIKI_BASE}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=20`;
    const res = await fetch(url);
    const data = await res.json();
    return (data.query && data.query.search) || [];
  }

  async function searchImages(query) {
    const url = `${COMMONS_API}?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(query)}&gsrlimit=24&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=400&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    if (!pages) return [];
    return Object.values(pages).filter(p => p.imageinfo && p.imageinfo[0]);
  }

  async function fetchFullExtract(title) {
    const url = `${WIKI_BASE}/w/api.php?action=query&prop=extracts&titles=${encodeURIComponent(title)}&format=json&origin=*&explaintext=1`;
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    if (!pages) return '';
    const page = Object.values(pages)[0];
    return (page && page.extract) || '';
  }

  // ===== Render helpers =====
  function renderFeatured(summary) {
    featuredWrap.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'featured-card';
    const img = summary.thumbnail ? `<img class="featured-img" src="${escapeHtml(summary.thumbnail.source)}" alt="">` : '';
    card.innerHTML = `
      ${img}
      <div class="featured-body">
        <h2>${escapeHtml(summary.title)}</h2>
        <p>${escapeHtml(summary.extract || '')}</p>
      </div>
    `;
    card.addEventListener('click', () => openArticle(summary.title));
    featuredWrap.appendChild(card);
  }

  function renderArticleListItem(item, container) {
    const btn = document.createElement('button');
    btn.className = 'article-item';
    const thumb = item.thumbnail
      ? `<img class="article-thumb" src="${escapeHtml(item.thumbnail.source)}" alt="">`
      : `<div class="article-thumb-placeholder"><span class="material-symbols-rounded">article</span></div>`;
    const desc = item.extract || item.snippet || '';
    btn.innerHTML = `
      ${thumb}
      <div class="article-info">
        <h3>${escapeHtml(item.title)}</h3>
        <p>${desc}</p>
      </div>
    `;
    btn.addEventListener('click', () => openArticle(item.title));
    container.appendChild(btn);
  }

  function renderImageTile(page, container) {
    const info = page.imageinfo[0];
    const meta = info.extmetadata || {};
    const label = (meta.ObjectName && meta.ObjectName.value) || page.title.replace(/^File:/, '');

    const tile = document.createElement('button');
    tile.className = 'image-tile';
    const thumbUrl = info.thumburl || info.url;
    tile.innerHTML = thumbUrl
      ? `<img src="${escapeHtml(thumbUrl)}" alt="" loading="lazy"><div class="image-tile-label">${escapeHtml(label)}</div>`
      : `<div class="image-tile-no-img"><span class="material-symbols-rounded">broken_image</span></div>`;

    tile.addEventListener('click', () => openImageViewer(page, info, meta, label));
    container.appendChild(tile);
  }

  function renderSkeletons(container, count) {
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const row = document.createElement('div');
      row.className = 'skeleton-item';
      row.innerHTML = `
        <div class="skeleton-thumb"></div>
        <div class="skeleton-lines">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w90"></div>
        </div>
      `;
      container.appendChild(row);
    }
  }

  function renderSkeletonGrid(container, count) {
    container.className = 'skeleton-grid';
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const tile = document.createElement('div');
      tile.className = 'skeleton-tile';
      container.appendChild(tile);
    }
  }

  // ===== Home: featured + topic chips =====
  const DEFAULT_TOPICS = [
    'Astronomy', 'Biology', 'History', 'Mathematics', 'Philosophy',
    'Technology', 'Art', 'Music', 'Literature', 'Physics',
    'Geography', 'Economics'
  ];

  function renderTopicChips() {
    topicChips.innerHTML = '';
    DEFAULT_TOPICS.forEach(topic => {
      const chip = document.createElement('button');
      chip.className = 'topic-chip';
      chip.textContent = topic;
      chip.addEventListener('click', () => {
        searchInput.value = topic;
        clearSearchBtn.classList.add('show');
        runSearch(topic);
      });
      topicChips.appendChild(chip);
    });
  }

  async function loadFeatured() {
    featuredWrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
    try {
      const summary = await fetchRandomSummary();
      renderFeatured(summary);
    } catch (e) {
      featuredWrap.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded">cloud_off</span>Couldn\'t load featured article.</div>';
    }
  }

  // ===== Tabs: Texts / Images ===== 
  let activeTab = 'text';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      tabbar.classList.toggle('on-images', activeTab === 'images');

      textResults.style.display = activeTab === 'text' ? '' : 'none';
      imageResults.style.display = activeTab === 'images' ? '' : 'none';

      const q = searchInput.value.trim();
      if (q) runSearch(q);
    });
  });

  // ===== Search flow =====
  let searchTimeout = null;
  let searchToken = 0;

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearSearchBtn.classList.toggle('show', q.length > 0);

    clearTimeout(searchTimeout);
    if (!q) {
      showHome();
      return;
    }
    searchTimeout = setTimeout(() => runSearch(q), 350);
  });

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearSearchBtn.classList.remove('show');
    showHome();
  });

  function showHome() {
    homeContent.style.display = '';
    textResults.style.display = 'none';
    imageResults.style.display = 'none';
    searchTabsWrap.classList.remove('show');
  }

  function showResultsLayout() {
    homeContent.style.display = 'none';
    searchTabsWrap.classList.add('show');
    textResults.style.display = activeTab === 'text' ? '' : 'none';
    imageResults.style.display = activeTab === 'images' ? '' : 'none';
  }

  async function runSearch(query) {
    showResultsLayout();
    const myToken = ++searchToken;

    if (activeTab === 'text') {
      renderSkeletons(resultsList, 6);
      try {
        const results = await searchArticles(query);
        if (myToken !== searchToken) return;

        if (!results.length) {
          resultsList.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded">search_off</span>No articles found.</div>';
          return;
        }

        resultsList.innerHTML = '';
        results.forEach(item => {
          const cleanSnippet = item.snippet.replace(/<\/?span[^>]*>/g, '');
          renderArticleListItem({ title: item.title, snippet: cleanSnippet }, resultsList);
        });
      } catch (e) {
        if (myToken !== searchToken) return;
        resultsList.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded">cloud_off</span>Search failed. Check your connection.</div>';
      }
    } else {
      renderSkeletonGrid(imageGrid, 8);
      try {
        const results = await searchImages(query);
        if (myToken !== searchToken) return;

        if (!results.length) {
          imageGrid.className = 'image-grid';
          imageGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-rounded">image_not_supported</span>No images found.</div>';
          return;
        }

        imageGrid.className = 'image-grid';
        imageGrid.innerHTML = '';
        results.forEach(page => renderImageTile(page, imageGrid));
      } catch (e) {
        if (myToken !== searchToken) return;
        imageGrid.className = 'image-grid';
        imageGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-rounded">cloud_off</span>Search failed. Check your connection.</div>';
      }
    }
  }

  randomBtn.addEventListener('click', async () => {
    try {
      const summary = await fetchRandomSummary();
      openArticle(summary.title);
    } catch (e) {}
  });

  // ===== Article page =====
  async function openArticle(title) {
    const titleBar = document.getElementById('articleTitleBar');
    const pbody = document.getElementById('articlePbody');

    titleBar.textContent = title;
    pbody.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

    openPage('pg-article');
    pbody.scrollTop = 0;

    try {
      const [summary, fullText] = await Promise.all([
        fetchSummary(title),
        fetchFullExtract(title).catch(() => '')
      ]);

      const hero = summary.thumbnail
        ? `<img class="article-hero" src="${escapeHtml(summary.thumbnail.source)}" alt="">`
        : (summary.originalimage ? `<img class="article-hero" src="${escapeHtml(summary.originalimage.source)}" alt="">` : '');

      const desc = summary.description
        ? `<p class="article-desc">${escapeHtml(summary.description)}</p>`
        : '';

      let bodyHtml = '';
      if (fullText) {
        bodyHtml = fullText
          .split(/\n{2,}/)
          .filter(p => p.trim() && !p.trim().match(/^==.*==$/))
          .slice(0, 30)
          .map(p => `<p>${escapeHtml(p.trim())}</p>`)
          .join('');
      } else {
        bodyHtml = `<p>${escapeHtml(summary.extract || '')}</p>`;
      }

      pbody.innerHTML = `
        ${hero}
        <div class="article-header">
          <h1>${escapeHtml(summary.title)}</h1>
          ${desc}
        </div>
        <div class="article-body">${bodyHtml}</div>
        <div class="article-footer">
          <button class="wiki-link-btn" id="openWikiBtn">
            <span class="material-symbols-rounded">open_in_new</span>
            Read on Wikipedia
          </button>
        </div>
      `;

      document.getElementById('openWikiBtn').addEventListener('click', () => {
        window.open(summary.content_urls?.desktop?.page || `${WIKI_BASE}/wiki/${encodeURIComponent(title)}`, '_blank');
      });

    } catch (e) {
      pbody.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded">error_outline</span>Couldn\'t load this article.</div>';
    }
  }

  // ===== Image viewer page =====
  function openImageViewer(page, info, meta, label) {
    const titleBar = document.getElementById('imageTitleBar');
    const pbody = document.getElementById('imagePbody');

    titleBar.textContent = label;

    const artist = meta.Artist ? stripHtml(meta.Artist.value) : '';
    const description = meta.ImageDescription ? stripHtml(meta.ImageDescription.value) : '';
    const license = meta.LicenseShortName ? meta.LicenseShortName.value : '';

    pbody.innerHTML = `
      <img class="img-viewer-hero" src="${escapeHtml(info.url)}" alt="${escapeHtml(label)}">
      <div class="article-header">
        <h1>${escapeHtml(label)}</h1>
      </div>
      <div class="img-viewer-caption">
        ${description ? `<p>${escapeHtml(description)}</p>` : ''}
        ${artist ? `<p><strong>Author:</strong> ${escapeHtml(artist)}</p>` : ''}
        ${license ? `<p><strong>License:</strong> ${escapeHtml(license)}</p>` : ''}
      </div>
      <div class="article-footer">
        <button class="wiki-link-btn" id="openCommonsBtn">
          <span class="material-symbols-rounded">open_in_new</span>
          View on Wikimedia Commons
        </button>
      </div>
    `;

    document.getElementById('openCommonsBtn').addEventListener('click', () => {
      window.open(`https://commons.wikimedia.org/wiki/${encodeURIComponent(page.title)}`, '_blank');
    });

    openPage('pg-image');
    pbody.scrollTop = 0;
  }

  function stripHtml(s) {
    const div = document.createElement('div');
    div.innerHTML = s;
    return div.textContent || '';
  }

  // ===== Init =====
  renderTopicChips();
  loadFeatured();
</script>

</body>
</html>
