name: orbit-android-debug

on:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: orbit-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: "com.orbit.app"

jobs:
  build:
    name: orbit-android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A validação inicial fica desativada temporariamente.
      # O Wrapper será regenerado e validado explicitamente antes do build.
      - name: Setup Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"
          cache-provider: basic
          gradle-home-cache-cleanup: true
          validate-wrappers: false

      - name: Locate Orbit project and configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          for candidate in \
            "$GITHUB_WORKSPACE/orbit" \
            "$GITHUB_WORKSPACE/Orbit" \
            "$GITHUB_WORKSPACE"; do

            if [ -f "$candidate/settings.gradle.kts" ] \
              && [ -f "$candidate/build.gradle.kts" ] \
              && [ -f "$candidate/app/build.gradle.kts" ] \
              && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Orbit Android project was not found."
            echo "Expected orbit/ or Orbit/ with settings.gradle.kts and app/build.gradle.kts."
            exit 1
          fi

          APP_MODULE_DIR="$PROJECT_DIR/app"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$PROJECT_DIR/local.properties"

          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_MODULE_DIR=$APP_MODULE_DIR"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          echo "Orbit project: $PROJECT_DIR"
          echo "Android module: $APP_MODULE_DIR"
          echo "Android SDK: $SDK_ROOT"

      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do

              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK setup completed."

      # Não executa ./gradlew neste ponto:
      # o JAR existente ainda não foi validado.
      - name: Regenerate official Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Using the Gradle distribution installed by setup-gradle:"
          gradle --version

          echo "Regenerating Wrapper files with Gradle 8.14.6..."

          gradle wrapper \
            --gradle-version 8.14.6 \
            --distribution-type bin \
            --no-daemon \
            --rerun-tasks

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle did not regenerate gradle-wrapper.jar."
            exit 1
          fi

          if [ ! -s "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle Wrapper properties are missing."
            exit 1
          fi

          # Preserva o checksum oficial da distribuição Gradle 8.14.6
          # utilizado pelo projeto.
          python3 - <<'PY'
          from pathlib import Path

          props = Path("gradle/wrapper/gradle-wrapper.properties")
          checksum = (
              "7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301"
              "fa7fa7e9407bd24"
          )

          lines = props.read_text(encoding="utf-8").splitlines()

          lines = [
              line for line in lines
              if not line.startswith("distributionSha256Sum=")
          ]

          lines.append(f"distributionSha256Sum={checksum}")
          props.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Gradle distribution checksum configured.")
          PY

          chmod +x ./gradlew

          if ! grep -Fq "gradle-8.14.6-bin.zip" \
            "gradle/wrapper/gradle-wrapper.properties"; then
            echo "ERROR: The generated Wrapper does not target Gradle 8.14.6."
            cat "gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          echo "Wrapper regeneration completed."
          sha256sum "gradle/wrapper/gradle-wrapper.jar"

      # A validação é executada depois de substituir o JAR desconhecido.
      # Se o novo JAR continuar a ser considerado desconhecido, o build para.
      - name: Validate regenerated Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify Orbit structure and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s "gradle/wrapper/gradle-wrapper.jar"
          test -s "gradle/wrapper/gradle-wrapper.properties"
          test -x "./gradlew"

          grep -Fq "gradle-8.14.6-bin.zip" \
            "gradle/wrapper/gradle-wrapper.properties"

          grep -Fq 'applicationId = "com.orbit.app"' \
            "app/build.gradle.kts"

          grep -Fq 'android:icon="@mipmap/ic_launcher"' \
            "app/src/main/AndroidManifest.xml"

          test -s "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -s "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path("app/src/main")
          errors = []

          for path in root.rglob("*.xml"):
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")

          required = [
              "res/mipmap-mdpi/ic_launcher.png",
              "res/mipmap-hdpi/ic_launcher.png",
              "res/mipmap-xhdpi/ic_launcher.png",
              "res/mipmap-xxhdpi/ic_launcher.png",
              "res/mipmap-xxxhdpi/ic_launcher.png",
              "res/mipmap-anydpi-v26/ic_launcher.xml",
              "res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]

          for relative in required:
              if not (root / relative).is_file():
                  errors.append(f"Missing launcher resource: {relative}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print("Orbit XML verification: PASS")
          print("Launcher mipmap resources: PASS")
          print(f"Kotlin files: {len(list(root.rglob('*.kt')))}")
          print(f"XML files: {len(list(root.rglob('*.xml')))}")
          PY

          echo "Orbit structure verification: PASS"

      - name: Verify Gradle Wrapper execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --version

      - name: Build Orbit Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Orbit Debug APK was not generated."
            find "$APP_MODULE_DIR/build/outputs" \
              -maxdepth 5 -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "Orbit Debug APK generated: $APK"

      - name: Create or load local signing keystore
        id: setup-signing
        env:
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 || secrets.LOOPLY_KEYSTORE_BASE64 }}
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD || secrets.LOOPLY_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS || secrets.LOOPLY_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD || secrets.LOOPLY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_DIR="$RUNNER_TEMP/orbit-local-signing-material"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          KEYSTORE_PATH="$SIGNING_DIR/orbit-local.keystore"
          INFO_PATH="$SIGNING_DIR/SIGNING-INFO.txt"

          KEY_ALIAS="${ORBIT_KEY_ALIAS:-orbit-local}"
          GENERATED=false

          if [ -n "${ORBIT_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${ORBIT_KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: Keystore password is missing."
              exit 1
            fi

            printf '%s' "$ORBIT_KEYSTORE_BASE64" \
              | base64 --decode > "$KEYSTORE_PATH"

            STORE_PASSWORD="$ORBIT_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${ORBIT_KEY_PASSWORD:-$STORE_PASSWORD}"

            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "ERROR: The decoded keystore is empty."
              exit 1
            fi

            if ! keytool -list \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ERROR: Could not verify the keystore or alias."
              exit 1
            fi

            KEYSTORE_TYPE="$(
              keytool -list \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$STORE_PASSWORD" 2>&1 \
                | sed -n 's/^Keystore type: //p' \
                | head -n 1
            )"

            KEYSTORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"

            echo "Existing signing keystore loaded."

          else
            echo "No existing signing key found; creating a local testing key."

            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEYSTORE_TYPE="PKCS12"

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype "$KEYSTORE_TYPE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=Orbit Local, OU=Development, O=Orbit, L=Luanda, ST=Luanda, C=AO"

            printf '%s\n' \
              "Orbit local/testing signing key" \
              "Keystore file: orbit-local.keystore" \
              "Keystore type: $KEYSTORE_TYPE" \
              "Key alias: $KEY_ALIAS" \
              "Keystore password: $STORE_PASSWORD" \
              "Key password: $KEY_PASSWORD" \
              "Keep this file and its passwords private." \
              "Configure ORBIT_KEYSTORE_BASE64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS and ORBIT_KEY_PASSWORD to reuse this key." \
              > "$INFO_PATH"

            chmod 600 "$INFO_PATH"

            base64 -w 0 "$KEYSTORE_PATH" \
              > "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            chmod 600 "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            GENERATED=true
            echo "Local testing keystore created."
          fi

          chmod 600 "$KEYSTORE_PATH"

          {
            echo "APP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APP_KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "APP_KEY_ALIAS=$KEY_ALIAS"
            echo "APP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "APP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "signing_dir=$SIGNING_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign Orbit APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$APP_MODULE_DIR/build/outputs/apk/debug"
          APK="$APK_DIR/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Input APK was not found."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f -name apksigner -print \
              | sort -V | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          SIGNED_APK="$APK_DIR/orbit-local-signed.apk"

          "$APKSIGNER" sign \
            --ks "$APP_KEYSTORE_PATH" \
            --ks-type "$APP_KEYSTORE_TYPE" \
            --ks-key-alias "$APP_KEY_ALIAS" \
            --ks-pass env:APP_KEYSTORE_PASSWORD \
            --key-pass env:APP_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

          echo "Signed APK: $SIGNED_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/orbit-local-signed.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          BYTES="$(stat -c%s "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"

          echo "APK: $APK"
          echo "Bytes: $BYTES"
          echo "Size: $MIB MiB"

      - name: Upload Orbit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signed-apk
          path: '**/build/outputs/apk/debug/orbit-local-signed.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Warn if repository is public and signing key is not archived
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private != true
        shell: bash
        run: |
          echo "::warning::A new local signing key was generated and will not be uploaded because this repository is public. Configure ORBIT_KEYSTORE_BASE64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS and ORBIT_KEY_PASSWORD in GitHub Secrets to reuse the same signing identity."

      - name: Upload generated signing keystore (private repositories only)
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signing-keystore
          path: ${{ steps.setup-signing.outputs.signing_dir }}/*
          if-no-files-found: error
          retention-days: 90