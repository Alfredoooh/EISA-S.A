name: orbit-android-debug

on:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: orbit-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: "com.orbit.app"
  GRADLE_VERSION: "9.3.1"
  AGP_VERSION: "9.1.1"
  ANDROID_COMPILE_SDK: "37"

jobs:
  build:
    name: orbit-android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic
          gradle-home-cache-cleanup: true
          validate-wrappers: false

      - name: Locate Orbit project and configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          for candidate in \
            "$GITHUB_WORKSPACE/Orbit" \
            "$GITHUB_WORKSPACE/orbit" \
            "$GITHUB_WORKSPACE"; do

            if [ -f "$candidate/settings.gradle.kts" ] \
              && [ -f "$candidate/build.gradle.kts" ] \
              && [ -f "$candidate/app/build.gradle.kts" ] \
              && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then

              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Orbit Android project was not found."
            echo "Expected Orbit/ or orbit/ with settings.gradle.kts and app/."
            exit 1
          fi

          APP_MODULE_DIR="$PROJECT_DIR/app"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_MODULE_DIR=$APP_MODULE_DIR"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          echo "Orbit project: $PROJECT_DIR"
          echo "Android module: $APP_MODULE_DIR"
          echo "Android SDK: $SDK_ROOT"

      - name: Install Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do

              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK API 37 installed."

      # Atualiza a configuração do projeto antes de executar qualquer
      # tarefa que configure o Android Gradle Plugin.
      - name: Migrate Orbit to compatible Android build versions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root_file = Path("build.gradle.kts")
          app_file = Path("app/build.gradle.kts")
          props_file = Path("gradle.properties")

          for path in (root_file, app_file, props_file):
              if not path.is_file():
                  sys.exit(f"ERROR: Required file not found: {path}")

          # 1. Android Gradle Plugin 8.13.2 -> 9.1.1.
          root_text = root_file.read_text(encoding="utf-8")

          agp_pattern = re.compile(
              r'(id\("com\.android\.application"\)\s*version\s*")[^"]+'
              r'("\s*apply false)'
          )

          root_text, agp_count = agp_pattern.subn(
              r'\g<1>9.1.1\2',
              root_text,
              count=1,
          )

          if agp_count != 1:
              sys.exit(
                  "ERROR: Could not safely update the Android Gradle Plugin "
                  "version in build.gradle.kts."
              )

          root_file.write_text(root_text, encoding="utf-8")

          # 2. Update compileSdk to API 37.
          app_text = app_file.read_text(encoding="utf-8")

          if re.search(r'(?m)^\s*compileSdk\s*=\s*36\b', app_text):
              app_text = re.sub(
                  r'(?m)^(\s*compileSdk\s*=\s*)36\b',
                  r'\g<1>37',
                  app_text,
                  count=1,
              )
          elif not re.search(r'(?m)^\s*compileSdk\s*=\s*37\b', app_text):
              sys.exit(
                  "ERROR: Could not safely set compileSdk to API 37."
              )

          # 3. Migrate the legacy Kotlin jvmTarget DSL.
          legacy_pattern = re.compile(
              r"""(?m)^[ \t]*kotlinOptions[ \t]*\{[ \t]*\r?\n"""
              r"""[ \t]*jvmTarget[ \t]*=[ \t]*["']17["'][ \t]*\r?\n"""
              r"""[ \t]*\}[ \t]*\r?\n?"""
          )

          if "kotlinOptions" in app_text:
              if not legacy_pattern.search(app_text):
                  sys.exit(
                      "ERROR: An unsupported kotlinOptions block was found. "
                      "The build file was not modified further."
                  )

              app_text = legacy_pattern.sub(
                  "",
                  app_text,
                  count=1,
              )

          compiler_target = "jvmTarget.set(JvmTarget.JVM_17)"

          if compiler_target not in app_text:
              dependencies_marker = re.search(
                  r"(?m)^dependencies\s*\{",
                  app_text,
              )

              if not dependencies_marker:
                  sys.exit(
                      "ERROR: Could not find the dependencies block "
                      "in app/build.gradle.kts."
                  )

              compiler_block = (
                  "kotlin {\n"
                  "    compilerOptions {\n"
                  "        jvmTarget.set(JvmTarget.JVM_17)\n"
                  "    }\n"
                  "}\n\n"
              )

              app_text = (
                  app_text[:dependencies_marker.start()]
                  + compiler_block
                  + app_text[dependencies_marker.start():]
              )

          import_line = (
              "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"
          )

          if import_line not in app_text:
              app_text = import_line + "\n\n" + app_text.lstrip("\n")

          if "kotlinOptions" in app_text:
              sys.exit(
                  "ERROR: Legacy kotlinOptions configuration remains."
              )

          # 4. Preserve the Material 3 Expressive dependencies.
          # They are intentionally not downgraded.
          app_file.write_text(app_text, encoding="utf-8")

          # 5. AGP 9 enables built-in Kotlin and its new DSL by default.
          # Opt out so the existing external Kotlin plugins and their
          # compiler configuration can be retained during this migration.
          props_text = props_file.read_text(encoding="utf-8")

          def set_property(text, key, value):
              pattern = re.compile(
                  rf"(?m)^[ \t]*{re.escape(key)}=.*$"
              )

              replacement = f"{key}={value}"

              if pattern.search(text):
                  return pattern.sub(replacement, text, count=1)

              return text.rstrip() + "\n" + replacement + "\n"

          props_text = set_property(
              props_text,
              "android.builtInKotlin",
              "false",
          )

          props_text = set_property(
              props_text,
              "android.newDsl",
              "false",
          )

          props_file.write_text(props_text, encoding="utf-8")

          # Verify that the root build script has the requested version.
          if 'version "9.1.1" apply false' not in root_text:
              sys.exit("ERROR: AGP 9.1.1 verification failed.")

          if "compileSdk = 37" not in app_text:
              sys.exit("ERROR: compileSdk 37 verification failed.")

          if compiler_target not in app_text:
              sys.exit("ERROR: JVM 17 compiler target is missing.")

          if "android.builtInKotlin=false" not in props_text:
              sys.exit("ERROR: Kotlin compatibility setting is missing.")

          print("Orbit build migration: PASS")
          print("Android Gradle Plugin: 9.1.1")
          print("Compile SDK: 37")
          print("Java/Kotlin target: 17")
          print("Existing Material 3 Expressive dependencies: preserved")
          PY

          echo "Root Gradle configuration:"
          cat build.gradle.kts

          echo "App Gradle configuration:"
          sed -n '1,110p' app/build.gradle.kts

          echo "Gradle compatibility properties:"
          cat gradle.properties

      - name: Verify Orbit project structure and resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if ! grep -Fq 'applicationId = "com.orbit.app"' \
            app/build.gradle.kts; then
            echo "ERROR: applicationId does not match com.orbit.app."
            exit 1
          fi

          if ! grep -Fq 'android:icon="@mipmap/ic_launcher"' \
            app/src/main/AndroidManifest.xml; then
            echo "ERROR: Launcher icon reference is missing."
            exit 1
          fi

          if ! grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' \
            app/src/main/AndroidManifest.xml; then
            echo "ERROR: Round launcher icon reference is missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path("app/src/main")
          errors = []

          for xml_file in root.rglob("*.xml"):
              try:
                  ET.parse(xml_file)
              except ET.ParseError as exc:
                  errors.append(f"{xml_file}: {exc}")

          required_icons = [
              "res/mipmap-mdpi/ic_launcher.png",
              "res/mipmap-hdpi/ic_launcher.png",
              "res/mipmap-xhdpi/ic_launcher.png",
              "res/mipmap-xxhdpi/ic_launcher.png",
              "res/mipmap-xxxhdpi/ic_launcher.png",
              "res/mipmap-anydpi-v26/ic_launcher.xml",
              "res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]

          for relative_path in required_icons:
              if not (root / relative_path).is_file():
                  errors.append(
                      f"Missing launcher resource: {relative_path}"
                  )

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print("Orbit XML verification: PASS")
          print("Launcher mipmap resources: PASS")
          print(f"Kotlin files: {len(list(root.rglob('*.kt')))}")
          print(f"XML files: {len(list(root.rglob('*.xml')))}")
          PY

      - name: Regenerate Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --version

          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin \
            --no-daemon \
            --rerun-tasks

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle Wrapper JAR was not generated."
            exit 1
          fi

          if [ ! -s "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle Wrapper properties are missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path("gradle/wrapper/gradle-wrapper.properties")
          checksum = (
              "b266d5ff6b90eada6dc3b20cb090e373"
              "1302e553a27c5d3e4df1f0d76beaff06"
          )

          lines = path.read_text(encoding="utf-8").splitlines()

          lines = [
              line for line in lines
              if not line.startswith("distributionSha256Sum=")
          ]

          url_line = next(
              (
                  line for line in lines
                  if line.startswith("distributionUrl=")
              ),
              None,
          )

          if (
              url_line is None
              or "gradle-9.3.1-bin.zip" not in url_line
          ):
              sys.exit(
                  "ERROR: Wrapper is not configured for Gradle 9.3.1."
              )

          lines.append(f"distributionSha256Sum={checksum}")

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("Gradle 9.3.1 distribution checksum configured.")
          PY

          chmod +x ./gradlew

          echo "Generated Wrapper JAR SHA-256:"
          sha256sum gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Validate regenerated Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --version

      - name: Build Orbit Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Orbit Debug APK was not generated."
            find "$APP_MODULE_DIR/build/outputs" \
              -maxdepth 5 \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo "Orbit Debug APK generated:"
          echo "$APK"

      - name: Create or load local signing keystore
        id: setup-signing
        env:
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 || secrets.LOOPLY_KEYSTORE_BASE64 }}
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD || secrets.LOOPLY_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS || secrets.LOOPLY_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD || secrets.LOOPLY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_DIR="$RUNNER_TEMP/orbit-local-signing-material"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          KEYSTORE_PATH="$SIGNING_DIR/orbit-local.keystore"
          INFO_PATH="$SIGNING_DIR/SIGNING-INFO.txt"

          KEY_ALIAS="${ORBIT_KEY_ALIAS:-orbit-local}"
          GENERATED=false

          if [ -n "${ORBIT_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${ORBIT_KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: Existing keystore password is missing."
              exit 1
            fi

            printf '%s' "$ORBIT_KEYSTORE_BASE64" \
              | base64 --decode > "$KEYSTORE_PATH"

            STORE_PASSWORD="$ORBIT_KEYSTORE_PASSWORD"
            KEY_PASSWORD="${ORBIT_KEY_PASSWORD:-$STORE_PASSWORD}"

            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "ERROR: The decoded keystore is empty."
              exit 1
            fi

            if ! keytool -list \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ERROR: Could not verify the keystore or alias."
              exit 1
            fi

            KEYSTORE_TYPE="$(
              keytool -list \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$STORE_PASSWORD" 2>&1 \
                | sed -n 's/^Keystore type: //p' \
                | head -n 1
            )"

            KEYSTORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"

            echo "Existing signing keystore loaded."

          else
            echo "No existing signing key supplied."
            echo "Generating a local testing key."

            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEYSTORE_TYPE="PKCS12"

            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"

            keytool -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype "$KEYSTORE_TYPE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=Orbit Local, OU=Development, O=Orbit, L=Luanda, ST=Luanda, C=AO"

            cat > "$INFO_PATH" <<EOF
          Orbit local/testing signing key
          Keystore file: orbit-local.keystore
          Keystore type: $KEYSTORE_TYPE
          Key alias: $KEY_ALIAS
          Keystore password: $STORE_PASSWORD
          Key password: $KEY_PASSWORD

          Keep this file and its passwords private.
          Reuse the same keystore for future updates.

          GitHub Secrets:
          ORBIT_KEYSTORE_BASE64
          ORBIT_KEYSTORE_PASSWORD
          ORBIT_KEY_ALIAS
          ORBIT_KEY_PASSWORD
          EOF

            chmod 600 "$INFO_PATH"

            base64 -w 0 "$KEYSTORE_PATH" \
              > "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            chmod 600 "$SIGNING_DIR/orbit-local.keystore.base64.txt"

            GENERATED=true
            echo "Local testing keystore created."
          fi

          chmod 600 "$KEYSTORE_PATH"

          {
            echo "APP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APP_KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "APP_KEY_ALIAS=$KEY_ALIAS"
            echo "APP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "APP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "signing_dir=$SIGNING_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign Orbit APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$APP_MODULE_DIR/build/outputs/apk/debug"
          APK="$APK_DIR/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Input APK was not found."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          SIGNED_APK="$APK_DIR/orbit-local-signed.apk"

          "$APKSIGNER" sign \
            --ks "$APP_KEYSTORE_PATH" \
            --ks-type "$APP_KEYSTORE_TYPE" \
            --ks-key-alias "$APP_KEY_ALIAS" \
            --ks-pass env:APP_KEYSTORE_PASSWORD \
            --key-pass env:APP_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo "Signed Orbit APK:"
          echo "$SIGNED_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APP_MODULE_DIR/build/outputs/apk/debug/orbit-local-signed.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          BYTES="$(stat -c%s "$APK")"
          MIB="$(awk -v bytes="$BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"

          echo "APK: $APK"
          echo "Bytes: $BYTES"
          echo "Size: $MIB MiB"

      - name: Upload Orbit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signed-apk
          path: '**/build/outputs/apk/debug/orbit-local-signed.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Warn if repository is public and the signing key is not archived
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private != true
        shell: bash
        run: |
          echo "::warning::A new local signing key was generated but will not be uploaded because this repository is public. Configure ORBIT_KEYSTORE_BASE64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS and ORBIT_KEY_PASSWORD in GitHub Secrets to reuse the same signing identity."

      - name: Upload generated signing keystore (private repositories only)
        if: steps.setup-signing.outputs.generated == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: orbit-local-signing-keystore
          path: ${{ steps.setup-signing.outputs.signing_dir }}/*
          if-no-files-found: error
          retention-days: 90