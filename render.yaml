services:
  - type: web
    name: nexa-news-node
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: REFRESH_SECONDS
        value: "600"
      - key: REFRESH_TOKEN
        generateValue: true